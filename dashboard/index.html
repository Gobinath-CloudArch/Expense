<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gobinath Family Expense — Enterprise Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* --- Dynamic Theming System --- */
    :root[data-theme="dark"] {
      --bg-color: #070b14; --bg-img: none; --sidebar: #090f1d; --panel: rgba(14, 21, 38, 1); 
      --border: #1e2e4e; --text: #f3f7fd; --muted: #8598b8; --glass-blur: 0px;
    }
    :root[data-theme="light"] {
      --bg-color: #f4f7f9; --bg-img: none; --sidebar: #ffffff; --panel: #ffffff; 
      --border: #e1e5eb; --text: #1a202c; --muted: #718096; --glass-blur: 0px;
    }
    :root[data-theme="neo-glass"] {
      --bg-color: #0f172a;
      --bg-img: 
        radial-gradient(at 0% 0%, rgba(56, 30, 114, 0.4) 0px, transparent 50%), 
        radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.4) 0px, transparent 50%);
      --sidebar: rgba(15, 23, 42, 0.4);
      --panel: rgba(17, 24, 39, 0.5);
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff; --muted: #94a3b8;
      --glass-blur: 16px;
    }
    
    :root {
      --primary: #4f6bf7; --primary-hover: #3d58e3;
      --green: #2ed573; --red: #ff5263; --warn: #fbc531;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: var(--bg-color); background-image: var(--bg-img); background-attachment: fixed;
      color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: 0.3s; 
    }

    /* Layout & Glassmorphism */
    .sidebar { 
      width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); 
      display: flex; flex-direction: column; padding: 24px 16px; 
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    }
    .main { flex: 1; padding: 28px 32px; overflow-y: auto; }
    
    .panel { 
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 24px; 
      backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .brand-box { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #4d72fe, #1f47dd); border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff; }
    .brand-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
    
    /* Navigation */
    .nav-list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: var(--muted); font-size: 13.5px; font-weight: 600; background: transparent; border: 1px solid transparent; cursor: pointer; text-align: left; transition: 0.2s; }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .nav-item.active { background: rgba(79, 107, 247, 0.15); color: var(--primary); border-color: rgba(79, 107, 247, 0.3); }

    /* Core UI Elements */
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text); cursor: pointer; transition: 0.2s; }
    .btn.primary { background: var(--primary); border: none; color: white; }
    .btn:hover:not(:disabled) { filter: brightness(1.15); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Tables & Forms */
    .table-controls { display: flex; gap: 12px; margin-bottom: 16px; }
    .input-field { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: var(--text); outline: none; font-size:14px; }
    .input-field:focus { border-color: var(--primary); }
    
    /* Fix for dropdown options in dark themes */
    select.input-field option { background-color: var(--panel); color: var(--text); }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { color: var(--muted); padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; cursor: pointer; user-select: none; }
    th:hover { color: var(--text); }
    td { padding: 14px 10px; border-bottom: 1px solid var(--border); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; }
    .badge.debit { background: rgba(255,82,99,0.15); color: var(--red); }
    .badge.credit { background: rgba(46,213,115,0.15); color: var(--green); }

    .chart-container { height: 300px; width: 100%; margin-bottom: 20px; }
    
    /* Budget Progress */
    .budget-row { margin-bottom: 16px; }
    .budget-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-val { font-size: 26px; font-weight: 800; }

    /* Modal System */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; place-items: center; z-index: 1000; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 550px; padding: 24px; backdrop-filter: blur(var(--glass-blur)); max-height: 90vh; overflow-y: auto;}
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-head h3 { font-size: 18px; font-weight: 700; }
    .close-btn { background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <aside class="sidebar">
    <div class="brand-box">
      <div class="brand-icon">G</div>
      <div class="brand-title">Gobinath Family<br><span style="font-size:11px; color:var(--muted); font-weight:400;">Finance Workspace</span></div>
    </div>
    <nav class="nav-list">
      <button class="nav-item active" onclick="navigate('overview')">⌂ Overview Dashboard</button>
      <button class="nav-item" onclick="navigate('records')">▤ All Records</button>
      <button class="nav-item" onclick="navigate('analyzer')">📈 Spend Analyzer</button>
      <button class="nav-item" onclick="navigate('budget')">🎯 Budget Tracker</button>
      <button class="nav-item" onclick="navigate('statements')">📥 Statements (Export)</button>
      <button class="nav-item" onclick="navigate('settings')">⚙ Settings & Users</button>
    </nav>
  </aside>

  <!-- Main View -->
  <main class="main">
    <div style="display:flex; justify-content:space-between; margin-bottom: 24px;">
      <div>
        <h2 id="view-title">Overview Dashboard</h2>
        <p id="view-sub" style="color:var(--muted); font-size:13px; margin-top:4px;">Executive financial summary.</p>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn" onclick="openTxModal('CREDIT')">+ Add Income</button>
        <button class="btn primary" onclick="openTxModal('DEBIT')">+ Add Expense</button>
      </div>
    </div>
    
    <div id="view-container"></div>
  </main>

  <!-- Transaction Modal (Add/Edit) -->
  <div id="tx-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="tx-modal-title">Add Transaction</h3>
        <button class="close-btn" onclick="closeModal('tx-modal')">×</button>
      </div>
      <form id="tx-form" onsubmit="saveTx(event)">
        <input type="hidden" id="tx-id">
        <div class="grid-2">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="tx-date" class="input-field" required>
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="tx-type" class="input-field" onchange="updateCatOptions()">
              <option value="DEBIT">Expense (Debit)</option>
              <option value="CREDIT">Income (Credit)</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Category</label>
            <select id="tx-category" class="input-field" required></select>
          </div>
          <div class="form-group">
            <label>Payment Method</label>
            <select id="tx-method" class="input-field">
              <option value="UPI">UPI / NetBanking</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="Cash">Cash</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="tx-desc" class="input-field" placeholder="e.g. Supermarket, Salary..." required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="tx-amount" step="0.01" class="input-field" required>
          </div>
          <div class="form-group">
            <label>User</label>
            <select id="tx-user" class="input-field">
              <option value="Gobinath">Gobinath</option>
              <option value="Avadaipriya K.">Avadaipriya K.</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Additional Notes</label>
          <input type="text" id="tx-notes" class="input-field" placeholder="Optional details...">
        </div>
        <button type="submit" class="btn primary" style="width: 100%; margin-top: 10px;" id="tx-save-btn">Save Transaction</button>
      </form>
    </div>
  </div>

  <!-- Budget Edit Modal -->
  <div id="budget-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Configure Budget</h3>
        <button class="close-btn" onclick="closeModal('budget-modal')">×</button>
      </div>
      <form onsubmit="saveBudget(event)">
        <div class="form-group">
          <label>Category</label>
          <select id="budget-cat" class="input-field"></select>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label>Limit Type</label>
            <select id="budget-type" class="input-field">
              <option value="Fixed">Fixed Amount (₹)</option>
              <option value="Percentage">Percentage (%) of Income</option>
            </select>
          </div>
          <div class="form-group">
            <label>Value</label>
            <input type="number" id="budget-val" class="input-field" required>
          </div>
        </div>
        <button type="submit" class="btn primary" style="width: 100%; margin-top: 10px;">Set Budget</button>
      </form>
    </div>
  </div>

  <!-- Add User Modal -->
  <div id="user-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Add Family Member</h3>
        <button class="close-btn" onclick="closeModal('user-modal')">×</button>
      </div>
      <form onsubmit="saveUser(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="new-user-name" class="input-field" required>
        </div>
        <div class="form-group">
          <label>Initial Password</label>
          <input type="password" id="new-user-pass" class="input-field" required>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="new-user-role" class="input-field">
            <option value="Read/Write">Owner (Read/Write)</option>
            <option value="Read Only">Guest (Read Only)</option>
          </select>
        </div>
        <button type="submit" class="btn primary" style="width: 100%; margin-top: 10px;">Create User</button>
      </form>
    </div>
  </div>

  <script>
    // --- IDLE TIMEOUT (10 MINUTES) ---
    let idleTime = 0;
    function resetTimer() { idleTime = 0; }
    window.onload = resetTimer;
    document.onmousemove = resetTimer;
    document.onkeypress = resetTimer;
    
    setInterval(() => {
      idleTime++;
      if (idleTime >= 10) {
        alert("Session expired due to 10 minutes of inactivity.");
        window.location.href = '../index.html'; // Assuming this routes back to login
      }
    }, 60000); // Check every 1 minute

    // --- STATE & INITIALIZATION ---
    let currentTheme = localStorage.getItem('gf_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);

    const expCategories = [
      'Rent Paid', 'Groceries', 'Electricity (EB)', 'Fuel / Petrol', 'Dining Out', 
      'Parking', 'Snacks', 'Credit Card Bill', 'Gold Loan', 'Loan', 'Home Maintenance',
      'Saloon / Parlour', 'LIC Payment', 'Utility Bills'
    ];
    const incCategories = ['Salary Received', 'Rent Received', 'Bonus', 'Reimbursement'];

    // Mock initial data
    let ledger = JSON.parse(localStorage.getItem('gf_ledger')) || [
      { id: '1', date: '2026-09-12', type: 'DEBIT', category: 'Groceries', desc: 'Monthly superstore shopping', method: 'UPI', notes: '', amount: 3260, user: 'Gobinath' },
      { id: '2', date: '2026-09-11', type: 'CREDIT', category: 'Salary Received', desc: 'September Salary', method: 'NetBanking', notes: 'Monthly Payroll', amount: 68000, user: 'Gobinath' },
      { id: '3', date: '2026-09-08', type: 'DEBIT', category: 'Credit Card Bill', desc: 'HDFC Payment', method: 'NetBanking', notes: '', amount: 15400, user: 'Avadaipriya K.' },
      { id: '4', date: '2026-08-15', type: 'DEBIT', category: 'Groceries', desc: 'August Groceries', method: 'UPI', notes: '', amount: 12000, user: 'Gobinath' }
    ];
    
    let budgets = JSON.parse(localStorage.getItem('gf_budgets')) || {
      'Groceries': { type: 'Fixed', val: 15000 },
      'Credit Card Bill': { type: 'Percentage', val: 15 }
    };

    let users = JSON.parse(localStorage.getItem('gf_users_list')) || [
      { name: 'Gobinath', role: 'Owner (Read/Write)' },
      { name: 'Avadaipriya K.', role: 'Owner (Read/Write)' }
    ];

    let sortCol = 'date', sortAsc = false;
    let selectedMonthA = '2026-08';
    let selectedMonthB = '2026-09';

    // --- VIEW ROUTER ---
    function navigate(view) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      const container = document.getElementById('view-container');
      const title = document.getElementById('view-title');
      const sub = document.getElementById('view-sub');

      if (view === 'overview') { title.innerText = 'Overview Dashboard'; sub.innerText = 'Executive financial summary.'; container.innerHTML = renderOverview(); renderOverviewChart(); }
      else if (view === 'records') { title.innerText = 'All Records'; sub.innerText = 'Search, sort, and manage ledger entries.'; container.innerHTML = renderAllRecords(); attachSearchLogic(); }
      else if (view === 'analyzer') { title.innerText = 'Spend Analyzer'; sub.innerText = 'Deep dive into spending patterns.'; container.innerHTML = renderAnalyzer(); renderAnalyzerChart(); }
      else if (view === 'budget') { title.innerText = 'Budget Tracker'; sub.innerText = 'Set limits and monitor category spending.'; container.innerHTML = renderBudget(); }
      else if (view === 'statements') { title.innerText = 'Statement Downloader'; sub.innerText = 'Export transaction history to CSV.'; container.innerHTML = renderStatements(); }
      else if (view === 'settings') { title.innerText = 'Settings, Users & Themes'; sub.innerText = 'Manage preferences and access control.'; container.innerHTML = renderSettings(); }
    }

    // --- VIEW 1: OVERVIEW ---
    function renderOverview() {
      let inc = 0, exp = 0;
      ledger.forEach(t => { if (t.type === 'CREDIT') inc += t.amount; else exp += t.amount; });

      return `
        <div class="kpi-grid">
          <div class="panel" style="margin:0; padding:20px;"><div style="font-size:12px; color:var(--muted); margin-bottom:6px;">NET BALANCE</div><div class="kpi-val">₹${(inc-exp).toLocaleString('en-IN')}</div></div>
          <div class="panel" style="margin:0; padding:20px;"><div style="font-size:12px; color:var(--muted); margin-bottom:6px;">TOTAL INCOME</div><div class="kpi-val" style="color:var(--green);">₹${inc.toLocaleString('en-IN')}</div></div>
          <div class="panel" style="margin:0; padding:20px;"><div style="font-size:12px; color:var(--muted); margin-bottom:6px;">TOTAL EXPENSES</div><div class="kpi-val" style="color:var(--red);">₹${exp.toLocaleString('en-IN')}</div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Trend Overview</h3></div>
          <div class="chart-container"><canvas id="overviewChart"></canvas></div>
        </div>
        ${renderTableHTML(ledger.slice(0, 5), 'Recent 5 Transactions', false)}
      `;
    }

    function renderOverviewChart() {
      const ctx = document.getElementById('overviewChart');
      if (!ctx || typeof Chart === 'undefined') return;
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['August', 'September'],
          datasets: [
            { label: 'Income', data: [68000, 68000], backgroundColor: '#2ed573' },
            { label: 'Expenses', data: [12500, 18660], backgroundColor: '#ff5263' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // --- VIEW 2: ALL RECORDS (Search, Sort, Edit, Delete) ---
    function renderAllRecords(data = ledger) {
      return `
        <div class="panel">
          <div class="table-controls">
            <input type="text" id="search-input" class="input-field" placeholder="Search by description, category, or amount...">
            <button class="btn primary" onclick="executeSearch()">Find</button>
          </div>
          <div id="records-table-container">${renderTableHTML(data, '', true)}</div>
        </div>
      `;
    }

    function executeSearch() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = ledger.filter(t => t.desc.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || t.amount.toString().includes(q));
      document.getElementById('records-table-container').innerHTML = renderTableHTML(filtered, '', true);
    }

    function attachSearchLogic() {
      document.getElementById('search-input').addEventListener('keyup', (e) => { if(e.key === 'Enter') executeSearch(); });
    }

    function sortTable(col) {
      sortAsc = (sortCol === col) ? !sortAsc : true;
      sortCol = col;
      ledger.sort((a, b) => {
        let valA = a[col], valB = b[col];
        if (col === 'amount') { valA = parseFloat(valA); valB = parseFloat(valB); }
        return (valA < valB ? -1 : (valA > valB ? 1 : 0)) * (sortAsc ? 1 : -1);
      });
      document.getElementById('records-table-container').innerHTML = renderTableHTML(ledger, '', true);
    }

    // --- VIEW 3: SPEND ANALYZER (Dynamic Comparison) ---
    function renderAnalyzer() {
      const aggA = {}, aggB = {};
      ledger.forEach(t => {
        if (t.type === 'DEBIT') {
          if (t.date.startsWith(selectedMonthA)) aggA[t.category] = (aggA[t.category] || 0) + t.amount;
          if (t.date.startsWith(selectedMonthB)) aggB[t.category] = (aggB[t.category] || 0) + t.amount;
        }
      });
      
      const allCats = [...new Set([...Object.keys(aggA), ...Object.keys(aggB)])];
      
      let compRows = allCats.map(c => {
        const valA = aggA[c] || 0;
        const valB = aggB[c] || 0;
        const diff = valB - valA;
        const diffStr = diff > 0 ? `<span style="color:var(--red);">+₹${diff.toLocaleString()}</span>` 
                      : diff < 0 ? `<span style="color:var(--green);">-₹${Math.abs(diff).toLocaleString()}</span>` 
                      : `<span>₹0</span>`;
        return `<tr><td>${c}</td><td>₹${valA.toLocaleString()}</td><td>₹${valB.toLocaleString()}</td><td>${diffStr}</td></tr>`;
      }).join('');

      if (!compRows) compRows = `<tr><td colspan="4" style="text-align:center;">No data for selected months.</td></tr>`;

      return `
        <div class="panel">
          <div class="panel-head">
            <h3>Month-over-Month Comparison</h3>
            <div style="display:flex; gap:10px;">
              <input type="month" id="cmp-month-a" class="input-field" value="${selectedMonthA}" onchange="updateAnalyzerMonths()">
              <span style="align-self:center;">vs</span>
              <input type="month" id="cmp-month-b" class="input-field" value="${selectedMonthB}" onchange="updateAnalyzerMonths()">
            </div>
          </div>
          <table style="margin-bottom: 24px;">
            <thead><tr><th>Category</th><th>Month A</th><th>Month B</th><th>Difference</th></tr></thead>
            <tbody>${compRows}</tbody>
          </table>
          
          <div class="panel-head"><h3>Selected Month (B) Distribution</h3></div>
          <div class="chart-container" style="height:250px;"><canvas id="analyzerChart"></canvas></div>
        </div>
      `;
    }

    function updateAnalyzerMonths() {
      selectedMonthA = document.getElementById('cmp-month-a').value;
      selectedMonthB = document.getElementById('cmp-month-b').value;
      navigate('analyzer');
    }

    function renderAnalyzerChart() {
      const ctx = document.getElementById('analyzerChart');
      if (!ctx || typeof Chart === 'undefined') return;
      
      const agg = {};
      ledger.filter(t => t.type === 'DEBIT' && t.date.startsWith(selectedMonthB)).forEach(t => {
        agg[t.category] = (agg[t.category] || 0) + t.amount;
      });

      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(agg),
          datasets: [{ data: Object.values(agg), backgroundColor: ['#4f6bf7', '#2ed573', '#ff5263', '#fbc531', '#a55eea', '#45aaf2'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
      });
    }

    // --- VIEW 4: BUDGET TRACKER ---
    function renderBudget() {
      let totalIncome = ledger.filter(t => t.type === 'CREDIT' && t.date.startsWith('2026-09')).reduce((s, t) => s + t.amount, 0);
      if(totalIncome === 0) totalIncome = 68000; 

      let budgetHTML = Object.keys(budgets).map(cat => {
        const b = budgets[cat];
        const target = b.type === 'Percentage' ? (totalIncome * b.val / 100) : b.val;
        const spent = ledger.filter(t => t.type === 'DEBIT' && t.category === cat && t.date.startsWith('2026-09')).reduce((s,t) => s + t.amount, 0);
        
        const pct = target > 0 ? Math.round((spent / target) * 100) : 0;
        const color = pct > 100 ? 'var(--red)' : pct > 85 ? 'var(--warn)' : 'var(--green)';
        const remains = target - spent;

        return `
          <div class="budget-row">
            <div class="budget-info">
              <div><strong>${cat}</strong> <span style="color:var(--muted); font-size:11px; margin-left:6px;">${b.type}</span></div>
              <div>₹${spent.toLocaleString()} / ₹${target.toLocaleString()} <span style="color:${color}; font-weight:700;">${pct}%</span></div>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(pct, 100)}%; background:${color};"></div></div>
            <div style="font-size:11px; color:var(--muted); margin-top:4px; text-align:right;">
              ${remains < 0 ? `<span style="color:var(--red)">Over budget by ₹${Math.abs(remains)}</span>` : `₹${remains} remaining`}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="panel">
          <div class="panel-head">
            <h3>Monthly Allocations</h3>
            <button class="btn primary" onclick="openBudgetModal()">+ Edit / Add Budget</button>
          </div>
          ${budgetHTML || '<p style="color:var(--muted); font-size:13px;">No budgets configured yet.</p>'}
        </div>
      `;
    }

    function openBudgetModal() {
      const select = document.getElementById('budget-cat');
      select.innerHTML = expCategories.map(c => `<option value="${c}">${c}</option>`).join('');
      document.getElementById('budget-modal').style.display = 'grid';
    }

    function saveBudget(e) {
      e.preventDefault();
      const cat = document.getElementById('budget-cat').value;
      const type = document.getElementById('budget-type').value;
      const val = parseFloat(document.getElementById('budget-val').value);
      
      budgets[cat] = { type, val };
      localStorage.setItem('gf_budgets', JSON.stringify(budgets));
      closeModal('budget-modal');
      navigate('budget');
    }

    // --- VIEW 5: STATEMENT DOWNLOADER ---
    function renderStatements() {
      return `
        <div class="panel">
          <div class="panel-head"><h3>Export Ledger to CSV</h3></div>
          <div class="grid-2">
            <div>
              <label style="font-size:12px; color:var(--muted);">Select Period</label>
              <select id="export-period" class="input-field" style="margin-top:6px;">
                <option value="CUR_MONTH">Current Month</option>
                <option value="LAST_3_MONTHS">Last 3 Months</option>
                <option value="LAST_6_MONTHS">Last 6 Months</option>
                <option value="LAST_1_YEAR">Last 1 Year</option>
                <option value="ALL">Entire Ledger History</option>
              </select>
            </div>
            <div style="display:flex; align-items:flex-end;">
              <button class="btn primary" style="width:100%; height:41px;" onclick="exportCSV()">Download Statement</button>
            </div>
          </div>
        </div>
      `;
    }

    function exportCSV() {
      const period = document.getElementById('export-period').value;
      let filtered = ledger;
      const now = new Date('2026-09-13');
      
      if (period !== 'ALL') {
        filtered = ledger.filter(t => {
          const tDate = new Date(t.date);
          if (period === 'CUR_MONTH') return t.date.startsWith('2026-09');
          if (period === 'LAST_3_MONTHS') return (now - tDate) <= (90 * 24 * 60 * 60 * 1000);
          if (period === 'LAST_6_MONTHS') return (now - tDate) <= (180 * 24 * 60 * 60 * 1000);
          if (period === 'LAST_1_YEAR') return (now - tDate) <= (365 * 24 * 60 * 60 * 1000);
          return true;
        });
      }

      if (filtered.length === 0) return alert("No transactions available for this period.");
      
      const headers = ['Date', 'Type', 'Category', 'Description', 'Method', 'Amount', 'User', 'Notes'];
      const rows = filtered.map(t => [t.date, t.type, t.category, `"${t.desc}"`, t.method || '', t.amount, t.user, `"${t.notes || ''}"`]);
      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `Gobinath_Statement_${period}.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    // --- VIEW 6: SETTINGS, USERS & THEMES ---
    function renderSettings() {
      let usersHtml = users.map(u => `
        <tr>
          <td>${u.name}</td>
          <td><span class="badge ${u.role.includes('Owner') ? 'credit' : 'debit'}">${u.role}</span></td>
          <td><button class="btn" style="padding:4px 8px; font-size:11px;" onclick="resetMemberPassword('${u.name}')">Reset Password</button></td>
        </tr>
      `).join('');

      return `
        <div class="panel">
          <div class="panel-head"><h3>Appearance Customization</h3></div>
          <div class="grid-2">
            <div>
              <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:8px;">Dashboard Theme</label>
              <select class="input-field" onchange="changeTheme(this.value)">
                <option value="dark" ${currentTheme==='dark'?'selected':''}>Professional Dark (Solid)</option>
                <option value="light" ${currentTheme==='light'?'selected':''}>Clean Light (Solid)</option>
                <option value="neo-glass" ${currentTheme==='neo-glass'?'selected':''}>Neo Glass (Graphic Background)</option>
              </select>
            </div>
          </div>
        </div>
        
        <div class="panel">
          <div class="panel-head">
            <h3>User Management</h3>
            <button class="btn primary" onclick="document.getElementById('user-modal').style.display='grid'">+ Add New User</button>
          </div>
          <p style="color:var(--muted); font-size:13px; margin-bottom:16px;">Manage accounts, reset passwords, and assign permissions.</p>
          <table style="margin-bottom:16px;">
            ${usersHtml}
          </table>
        </div>
      `;
    }

    function changeTheme(val) {
      currentTheme = val;
      document.documentElement.setAttribute('data-theme', val);
      localStorage.setItem('gf_theme', val);
    }

    function resetMemberPassword(uid) {
      if(confirm(`Reset password for ${uid}? They will be forced to set a new password on their next login.`)) {
        alert(`Password cleared for ${uid}.`);
      }
    }

    function saveUser(e) {
      e.preventDefault();
      const name = document.getElementById('new-user-name').value;
      const role = document.getElementById('new-user-role').value;
      users.push({ name, role });
      localStorage.setItem('gf_users_list', JSON.stringify(users));
      
      closeModal('user-modal');
      navigate('settings');
    }

    // --- TRANSACTION MODAL CONTROLS (Add, Edit, Delete) ---
    function openTxModal(type) {
      document.getElementById('tx-form').reset();
      document.getElementById('tx-id').value = '';
      document.getElementById('tx-modal-title').innerText = type === 'DEBIT' ? 'Add Expense' : 'Add Income';
      document.getElementById('tx-type').value = type;
      document.getElementById('tx-date').valueAsDate = new Date();
      document.getElementById('tx-save-btn').innerText = 'Save Transaction';
      updateCatOptions();
      document.getElementById('tx-modal').style.display = 'grid';
    }

    function updateCatOptions() {
      const type = document.getElementById('tx-type').value;
      const catSelect = document.getElementById('tx-category');
      const list = type === 'DEBIT' ? expCategories : incCategories;
      catSelect.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // THIS FIXES THE ALERT ISSUE - Wires directly to the real modal
    function editTx(id) {
      const t = ledger.find(x => x.id === id);
      if (!t) return;
      document.getElementById('tx-id').value = t.id;
      document.getElementById('tx-modal-title').innerText = 'Edit Transaction';
      document.getElementById('tx-date').value = t.date;
      document.getElementById('tx-type').value = t.type;
      updateCatOptions();
      document.getElementById('tx-category').value = t.category;
      document.getElementById('tx-desc').value = t.desc;
      document.getElementById('tx-amount').value = t.amount;
      document.getElementById('tx-user').value = t.user;
      document.getElementById('tx-method').value = t.method || 'UPI';
      document.getElementById('tx-notes').value = t.notes || '';
      document.getElementById('tx-save-btn').innerText = 'Update Transaction';
      document.getElementById('tx-modal').style.display = 'grid';
    }

    function deleteTx(id) {
      if (confirm('Delete this transaction permanently?')) {
        ledger = ledger.filter(x => x.id !== id);
        localStorage.setItem('gf_ledger', JSON.stringify(ledger));
        
        const activeNav = document.querySelector('.nav-item.active').innerText;
        if(activeNav.includes('Records')) navigate('records');
        else navigate('overview');
      }
    }

    function saveTx(e) {
      e.preventDefault();
      const id = document.getElementById('tx-id').value || String(Date.now());
      
      const record = {
        id: id,
        date: document.getElementById('tx-date').value,
        type: document.getElementById('tx-type').value,
        category: document.getElementById('tx-category').value,
        method: document.getElementById('tx-method').value,
        desc: document.getElementById('tx-desc').value,
        notes: document.getElementById('tx-notes').value,
        amount: parseFloat(document.getElementById('tx-amount').value),
        user: document.getElementById('tx-user').value
      };

      const idx = ledger.findIndex(x => x.id === id);
      if (idx >= 0) ledger[idx] = record;
      else ledger.unshift(record);

      localStorage.setItem('gf_ledger', JSON.stringify(ledger));
      closeModal('tx-modal');
      
      const activeNav = document.querySelector('.nav-item.active').innerText;
      if(activeNav.includes('Records')) navigate('records');
      else navigate('overview');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }

    // --- REUSABLE HTML GENERATORS ---
    function renderTableHTML(data, title, sortable) {
      const th = (lbl, col) => sortable ? `<th onclick="sortTable('${col}')">${lbl} ${sortCol===col ? (sortAsc?'↑':'↓') : ''}</th>` : `<th>${lbl}</th>`;
      return `
        ${title ? `<div class="panel-head"><h3>${title}</h3></div>` : ''}
        <table>
          <thead>
            <tr>${th('Date','date')} ${th('Type','type')} ${th('Category','category')} ${th('Description','desc')} ${th('Amount','amount')} <th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.length === 0 ? '<tr><td colspan="6" style="text-align:center;">No records found.</td></tr>' : ''}
            ${data.map(t => `
              <tr>
                <td>${t.date}</td>
                <td><span class="badge ${t.type.toLowerCase()}">${t.type}</span></td>
                <td>${t.category}</td>
                <td>${t.desc}</td>
                <td style="font-weight:700; color:${t.type==='CREDIT'?'var(--green)':'var(--red)'};">${t.type==='CREDIT'?'+':'-'} ₹${parseFloat(t.amount).toLocaleString('en-IN')}</td>
                <td>
                  <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="editTx('${t.id}')">✎ Edit</button>
                  <button class="btn" style="padding:4px 8px; font-size:11px; color:var(--red);" onclick="deleteTx('${t.id}')">🗑 Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // Boot App
    navigate('overview');
  </script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gobinath Family Expense — Enterprise Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root[data-theme="dark"] {
      --bg: #070b14; --sidebar: #090f1d; --panel: rgba(14, 21, 38, 0.85); 
      --border: #1e2e4e; --text: #f3f7fd; --muted: #8598b8;
    }
    :root[data-theme="light"] {
      --bg: #f4f7f9; --sidebar: #ffffff; --panel: #ffffff; 
      --border: #e1e5eb; --text: #1a202c; --muted: #718096;
    }
    :root[data-theme="midnight"] {
      --bg: #000000; --sidebar: #0a0a0a; --panel: #111111; 
      --border: #333333; --text: #f0f0f0; --muted: #888888;
    }
    :root {
      --primary: #4f6bf7; --primary-hover: #3d58e3;
      --green: #2ed573; --red: #ff5263; --warn: #fbc531;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

    .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 16px; transition: 0.3s; }
    .main { flex: 1; padding: 28px 32px; overflow-y: auto; }
    
    .brand-box { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .brand-icon { width: 38px; height: 38px; background: linear-gradient(135deg, #4d72fe, #1f47dd); border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff; }
    .brand-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
    
    .nav-list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: var(--muted); font-size: 13.5px; font-weight: 600; background: transparent; border: 1px solid transparent; cursor: pointer; text-align: left; transition: 0.2s; }
    .nav-item:hover { color: var(--text); background: rgba(120, 120, 120, 0.08); }
    .nav-item.active { background: rgba(79, 107, 247, 0.15); color: var(--primary); border-color: rgba(79, 107, 247, 0.3); }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .btn { padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; transition: 0.2s; }
    .btn.primary { background: var(--primary); border: none; color: white; }
    .btn:hover { filter: brightness(1.1); }

    .table-controls { display: flex; gap: 12px; margin-bottom: 16px; }
    .search-input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
    .search-input:focus { border-color: var(--primary); }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { color: var(--muted); padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; cursor: pointer; user-select: none; }
    th:hover { color: var(--text); }
    td { padding: 14px 10px; border-bottom: 1px solid var(--border); }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; }
    .badge.debit { background: rgba(255,82,99,0.15); color: var(--red); }
    .badge.credit { background: rgba(46,213,115,0.15); color: var(--green); }

    .chart-container { height: 300px; width: 100%; margin-bottom: 20px; }
    .budget-row { margin-bottom: 16px; }
    .budget-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .bar-bg { width: 100%; height: 8px; background: rgba(120,120,120,0.2); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-val { font-size: 26px; font-weight: 800; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand-box">
      <div class="brand-icon">G</div>
      <div class="brand-title">Gobinath Family<br><span style="font-size:11px; color:var(--muted); font-weight:400;">Finance Workspace</span></div>
    </div>
    <nav class="nav-list">
      <button class="nav-item active" onclick="navigate('overview')">⌂ Overview Dashboard</button>
      <button class="nav-item" onclick="navigate('records')">▤ All Records</button>
      <button class="nav-item" onclick="navigate('analyzer')">📈 Spend Analyzer</button>
      <button class="nav-item" onclick="navigate('budget')">🎯 Budget Tracker</button>
      <button class="nav-item" onclick="navigate('statements')">📥 Statements (Export)</button>
      <button class="nav-item" onclick="navigate('settings')">⚙ Settings & Themes</button>
    </nav>
  </aside>

  <!-- Main Area -->
  <main class="main">
    <div style="display:flex; justify-content:space-between; margin-bottom: 24px;">
      <div>
        <h2 id="view-title">Overview Dashboard</h2>
        <p id="view-sub" style="color:var(--muted); font-size:13px; margin-top:4px;">Executive financial summary.</p>
      </div>
      <div>
        <button class="btn" onclick="openTxModal('CREDIT')">+ Add Income</button>
        <button class="btn primary" onclick="openTxModal('DEBIT')">+ Add Expense</button>
      </div>
    </div>
    
    <div id="view-container"></div>
  </main>

  <script>
    // System Init
    let currentTheme = localStorage.getItem('gf_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);

    // Core Categories including requested additions
    const expCategories = [
      'Rent Paid', 'Groceries', 'Electricity (EB)', 'Fuel / Petrol', 'Dining Out', 
      'Parking', 'Snacks', 'Credit Card Bill', 'Gold Loan', 'Loan', 'Home Maintenance'
    ];
    const incCategories = ['Salary Received', 'Rent Received', 'Bonus', 'Reimbursement', 'Loan Disbursement'];

    // Core Ledger Base Data (Uses LocalStorage for frontend simulation)
    let ledger = JSON.parse(localStorage.getItem('gf_ledger')) || [
      { id: '1', date: '2026-09-12', type: 'DEBIT', category: 'Groceries', desc: 'Monthly superstore shopping', amount: 3260, user: 'Gobinath' },
      { id: '2', date: '2026-09-11', type: 'CREDIT', category: 'Salary Received', desc: 'September Salary', amount: 68000, user: 'Gobinath' },
      { id: '3', date: '2026-09-08', type: 'DEBIT', category: 'Credit Card Bill', desc: 'HDFC Payment', amount: 15400, user: 'Avadaipriya K.' }
    ];
    
    let sortCol = 'date', sortAsc = false;

    // View Engine
    function navigate(view) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      const container = document.getElementById('view-container');
      const title = document.getElementById('view-title');

      if (view === 'overview') { title.innerText = 'Overview Dashboard'; container.innerHTML = renderOverview(); renderOverviewChart(); }
      else if (view === 'records') { title.innerText = 'All Records'; container.innerHTML = renderAllRecords(); attachSearchLogic(); }
      else if (view === 'analyzer') { title.innerText = 'Spend Analyzer'; container.innerHTML = renderAnalyzer(); renderAnalyzerChart(); }
      else if (view === 'budget') { title.innerText = 'Budget Tracker'; container.innerHTML = renderBudget(); }
      else if (view === 'statements') { title.innerText = 'Statement Downloader'; container.innerHTML = renderStatements(); }
      else if (view === 'settings') { title.innerText = 'Settings & Themes'; container.innerHTML = renderSettings(); }
    }

    // --- Overview ---
    function renderOverview() {
      let inc = 0, exp = 0;
      ledger.forEach(t => { if (t.type === 'CREDIT') inc += t.amount; else if (t.type === 'DEBIT') exp += t.amount; });

      return `
        <div class="kpi-grid">
          <div class="panel" style="margin:0; padding:20px;"><div style="font-size:12px; color:var(--muted); margin-bottom:6px;">NET INCOME</div><div class="kpi-val">₹${(inc-exp).toLocaleString('en-IN')}</div></div>
          <div class="panel" style="margin:0; padding:20px;"><div style="font-size:12px; color:var(--muted); margin-bottom:6px;">TOTAL EXPENSES</div><div class="kpi-val" style="color:var(--red);">₹${exp.toLocaleString('en-IN')}</div></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Income vs Expenses (Trend)</h3></div>
          <div class="chart-container"><canvas id="overviewChart"></canvas></div>
        </div>
        ${renderTableHTML(ledger.slice(0, 5), 'Recent 5 Transactions', false)}
      `;
    }

    function renderOverviewChart() {
      const ctx = document.getElementById('overviewChart');
      if (!ctx || typeof Chart === 'undefined') return;
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Last Month', 'This Month'],
          datasets: [
            { label: 'Income', data: [68000, 68000], backgroundColor: '#2ed573' },
            { label: 'Expenses', data: [22000, 29460], backgroundColor: '#ff5263' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // --- All Records (Search & Sort) ---
    function renderAllRecords(data = ledger) {
      return `
        <div class="panel">
          <div class="table-controls">
            <input type="text" id="search-input" class="search-input" placeholder="Search by description, category, or amount...">
            <button class="btn" onclick="executeSearch()">🔍 Find</button>
          </div>
          <div id="records-table-container">${renderTableHTML(data, '', true)}</div>
        </div>
      `;
    }

    function executeSearch() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = ledger.filter(t => t.desc.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || t.amount.toString().includes(q));
      document.getElementById('records-table-container').innerHTML = renderTableHTML(filtered, '', true);
    }

    function attachSearchLogic() {
      document.getElementById('search-input').addEventListener('keyup', (e) => { if(e.key === 'Enter') executeSearch(); });
    }

    function sortTable(col) {
      sortAsc = (sortCol === col) ? !sortAsc : true;
      sortCol = col;
      ledger.sort((a, b) => {
        let valA = a[col], valB = b[col];
        if (col === 'amount') { valA = parseFloat(valA); valB = parseFloat(valB); }
        return (valA < valB ? -1 : (valA > valB ? 1 : 0)) * (sortAsc ? 1 : -1);
      });
      document.getElementById('records-table-container').innerHTML = renderTableHTML(ledger, '', true);
    }

    // --- Spend Analyzer ---
    function renderAnalyzer() {
      return `
        <div class="panel">
          <div class="panel-head"><h3>Month-over-Month Comparison</h3></div>
          <table style="margin-bottom: 20px;">
            <thead><tr><th>Category</th><th>August</th><th>September</th><th>Difference</th></tr></thead>
            <tbody>
              <tr><td>Groceries</td><td>₹12,000</td><td>₹14,500</td><td style="color:var(--red);">+₹2,500</td></tr>
              <tr><td>Parking</td><td>₹500</td><td>₹1,200</td><td style="color:var(--red);">+₹700</td></tr>
            </tbody>
          </table>
          <div class="panel-head"><h3>Expense Distribution</h3></div>
          <div class="chart-container" style="height:250px;"><canvas id="analyzerChart"></canvas></div>
        </div>
      `;
    }

    function renderAnalyzerChart() {
      const ctx = document.getElementById('analyzerChart');
      if (!ctx || typeof Chart === 'undefined') return;
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Groceries', 'Credit Card Bill', 'Snacks', 'Parking'],
          datasets: [{ data: [40, 30, 15, 15], backgroundColor: ['#4f6bf7', '#2ed573', '#ff5263', '#fbc531'] }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
      });
    }

    // --- Budget Tracker ---
    function renderBudget() {
      const budgets = [
        { cat: 'Groceries', type: 'Fixed', target: 15000, spent: 14500 },
        { cat: 'Credit Card Bill', type: 'Percentage (15%)', target: 10200, spent: 15400 } // Example over budget
      ];

      return `
        <div class="panel">
          <div class="panel-head"><h3>Monthly Allocations</h3></div>
          ${budgets.map(b => {
            const pct = Math.round((b.spent / b.target) * 100);
            const color = pct > 100 ? 'var(--red)' : pct > 85 ? 'var(--warn)' : 'var(--green)';
            const remains = b.target - b.spent;
            return `
              <div class="budget-row">
                <div class="budget-info">
                  <div><strong>${b.cat}</strong> <span style="color:var(--muted); font-size:11px; margin-left:6px;">${b.type}</span></div>
                  <div>₹${b.spent.toLocaleString()} / ₹${b.target.toLocaleString()} <span style="color:${color}; font-weight:700;">${pct}%</span></div>
                </div>
                <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(pct, 100)}%; background:${color};"></div></div>
                <div style="font-size:11px; color:var(--muted); margin-top:4px; text-align:right;">
                  ${remains < 0 ? `Over budget by ₹${Math.abs(remains)}` : `₹${remains} remaining`}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // --- Statement Downloader (CSV) ---
    function renderStatements() {
      return `
        <div class="panel">
          <div class="panel-head"><h3>Export Ledger to CSV</h3></div>
          <div class="grid-2">
            <div>
              <label style="font-size:12px; color:var(--muted);">Select Period</label>
              <select id="export-period" class="search-input" style="width:100%; margin-top:6px;">
                <option value="ALL">Entire Ledger History</option>
                <option value="CUR_MONTH">Current Month</option>
              </select>
            </div>
            <div style="display:flex; align-items:flex-end;">
              <button class="btn primary" style="width:100%; height:38px;" onclick="exportCSV()">Download CSV</button>
            </div>
          </div>
        </div>
      `;
    }

    function exportCSV() {
      if (ledger.length === 0) return alert("No transactions available.");
      const headers = ['Date', 'Type', 'Category', 'Description', 'Amount', 'User'];
      const rows = ledger.map(t => [t.date, t.type, t.category, `"${t.desc}"`, t.amount, t.user]);
      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `Gobinath_Statement_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    // --- Settings & Themes ---
    function renderSettings() {
      return `
        <div class="panel">
          <div class="panel-head"><h3>Appearance Customization</h3></div>
          <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:8px;">Dashboard Theme</label>
          <select id="theme-select" class="search-input" onchange="changeTheme(this.value)">
            <option value="dark" ${currentTheme==='dark'?'selected':''}>Professional Dark</option>
            <option value="light" ${currentTheme==='light'?'selected':''}>Clean Light</option>
            <option value="midnight" ${currentTheme==='midnight'?'selected':''}>OLED Midnight</option>
          </select>
        </div>
      `;
    }

    function changeTheme(val) {
      currentTheme = val;
      document.documentElement.setAttribute('data-theme', val);
      localStorage.setItem('gf_theme', val);
    }

    // --- Utility: Render Tables ---
    function renderTableHTML(data, title, sortable) {
      const th = (lbl, col) => sortable ? `<th onclick="sortTable('${col}')">${lbl} ${sortCol===col ? (sortAsc?'↑':'↓') : ''}</th>` : `<th>${lbl}</th>`;
      return `
        ${title ? `<div class="panel-head"><h3>${title}</h3></div>` : ''}
        <table>
          <thead>
            <tr>${th('Date','date')} ${th('Type','type')} ${th('Category','category')} ${th('Description','desc')} ${th('Amount','amount')} <th>Actions</th></tr>
          </thead>
          <tbody>
            ${data.length === 0 ? '<tr><td colspan="6" style="text-align:center;">No records found.</td></tr>' : ''}
            ${data.map(t => `
              <tr>
                <td>${t.date}</td>
                <td><span class="badge ${t.type.toLowerCase()}">${t.type}</span></td>
                <td>${t.category}</td>
                <td>${t.desc}</td>
                <td style="font-weight:700; color:${t.type==='CREDIT'?'var(--green)':'var(--red)'};">${t.type==='CREDIT'?'+':'-'} ₹${parseFloat(t.amount).toLocaleString('en-IN')}</td>
                <td>
                  <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="alert('Open Edit Modal')">✎</button>
                  <button class="btn" style="padding:4px 8px; font-size:11px; color:var(--red);" onclick="alert('Confirm Delete')">🗑</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // Initialization
    navigate('overview');
  </script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ஆதிரா மதிவதனி Family Expenser</title>
  
  <link rel="icon" href="../logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../logo.png">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    /* 
    ======================================================================
    ENTERPRISE THEMING SYSTEM
    ======================================================================
    */
    :root[data-theme="dark"] { 
      --bg-color: #070b14; 
      --bg-img: linear-gradient(rgba(7, 11, 20, 0.92), rgba(7, 11, 20, 0.92)), 
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop'); 
      --sidebar: rgba(9, 15, 29, 0.7); 
      --panel: rgba(14, 21, 38, 0.75); 
      --border: rgba(30, 46, 78, 0.8); 
      --text: #f3f7fd; 
      --muted: #8598b8; 
      --glass-blur: 16px; 
      --primary: #4f6bf7; 
      --primary-hover: #3d58e3; 
    }
    
    :root[data-theme="light"] { 
      --bg-color: #f4f7f9; 
      --bg-img: linear-gradient(rgba(244, 247, 249, 0.88), rgba(244, 247, 249, 0.88)), 
                url('https://images.unsplash.com/photo-1557682250-33bd709cbe85?q=80&w=2000&auto=format&fit=crop'); 
      --sidebar: rgba(255, 255, 255, 0.6); 
      --panel: rgba(255, 255, 255, 0.7); 
      --border: rgba(225, 229, 235, 0.8); 
      --text: #1a202c; 
      --muted: #718096; 
      --glass-blur: 16px; 
      --primary: #4f6bf7; 
      --primary-hover: #3d58e3; 
    }
    
    :root[data-theme="neo-glass"] { 
      --bg-color: #0f172a; 
      --bg-img: radial-gradient(at 0% 0%, rgba(56, 30, 114, 0.4) 0px, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.4) 0px, transparent 50%); 
      --sidebar: rgba(15, 23, 42, 0.4); 
      --panel: rgba(17, 24, 39, 0.5); 
      --border: rgba(255, 255, 255, 0.1); 
      --text: #ffffff; 
      --muted: #94a3b8; 
      --glass-blur: 16px; 
      --primary: #4f6bf7; 
      --primary-hover: #3d58e3; 
    }
    
    :root[data-theme="love"] { 
      --bg-color: #1a050a; 
      --bg-img: linear-gradient(rgba(26, 5, 10, 0.88), rgba(26, 5, 10, 0.88)), 
                url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=2000&auto=format&fit=crop'); 
      --sidebar: rgba(40, 10, 20, 0.5); 
      --panel: rgba(60, 15, 30, 0.6); 
      --border: rgba(255, 77, 109, 0.25); 
      --text: #ffe0e6; 
      --muted: #ffb3c6; 
      --glass-blur: 16px; 
      --primary: #ff4d6d; 
      --primary-hover: #c9184a; 
    }
    
    :root[data-theme="cyberpunk"] { 
      --bg-color: #0d0221; 
      --bg-img: linear-gradient(rgba(13, 2, 33, 0.9), rgba(13, 2, 33, 0.9)), 
                url('https://images.unsplash.com/photo-1555680202-c86f0e12f086?q=80&w=2000'); 
      --sidebar: rgba(13, 2, 33, 0.8); 
      --panel: rgba(26, 9, 51, 0.8); 
      --border: #00ffcc; 
      --text: #00ffcc; 
      --muted: #ff007f; 
      --glass-blur: 10px; 
      --primary: #ff007f; 
      --primary-hover: #e60073; 
      --green: #00ffcc; 
      --red: #ff007f; 
      --warn: #fbc531; 
    }
    
    :root[data-theme="ocean"] { 
      --bg-color: #001f3f; 
      --bg-img: linear-gradient(rgba(0, 31, 63, 0.9), rgba(0, 31, 63, 0.9)), 
                url('https://images.unsplash.com/photo-1582967788606-a171c1080cb0?q=80&w=2000'); 
      --sidebar: rgba(0, 31, 63, 0.7); 
      --panel: rgba(0, 43, 86, 0.8); 
      --border: rgba(0, 116, 217, 0.5); 
      --text: #7fdbff; 
      --muted: #39cccc; 
      --glass-blur: 12px; 
      --primary: #0074d9; 
      --primary-hover: #0056b3; 
      --green: #2ecc40; 
      --red: #ff4136; 
      --warn: #ff851b; 
    }
    
    :root[data-theme="forest"] { 
      --bg-color: #011f10; 
      --bg-img: linear-gradient(rgba(1, 31, 16, 0.9), rgba(1, 31, 16, 0.9)), 
                url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=2000'); 
      --sidebar: rgba(1, 31, 16, 0.7); 
      --panel: rgba(2, 43, 22, 0.8); 
      --border: rgba(39, 174, 96, 0.5); 
      --text: #e8f5e9; 
      --muted: #a5d6a7; 
      --glass-blur: 12px; 
      --primary: #27ae60; 
      --primary-hover: #2ecc71; 
      --green: #2ecc40; 
      --red: #e74c3c; 
      --warn: #f1c40f; 
    }
    
    :root[data-theme="sunset"] { 
      --bg-color: #2c0e18; 
      --bg-img: linear-gradient(rgba(44, 14, 24, 0.85), rgba(44, 14, 24, 0.85)), 
                url('https://images.unsplash.com/photo-1502489597346-bf10f4d5be94?q=80&w=2000'); 
      --sidebar: rgba(44, 14, 24, 0.6); 
      --panel: rgba(60, 20, 35, 0.75); 
      --border: rgba(255, 118, 117, 0.4); 
      --text: #ffeaa7; 
      --muted: #fab1a0; 
      --glass-blur: 16px; 
      --primary: #ff7675; 
      --primary-hover: #d63031; 
      --green: #00b894; 
      --red: #d63031; 
      --warn: #fdcb6e; 
    }

    :root { 
      --green: #2ed573; 
      --red: #ff5263; 
      --warn: #fbc531; 
    }

    /* 
    ======================================================================
    CORE LAYOUT & RESET
    ======================================================================
    */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    body { 
      background-color: var(--bg-color); 
      background-image: var(--bg-img); 
      background-attachment: fixed; 
      background-size: cover; 
      background-position: center; 
      color: var(--text); 
      display: flex; 
      min-height: 100vh; 
      overflow-x: hidden; 
      transition: background 0.3s, color 0.3s; 
    }
    
    .sidebar { 
      width: 260px; 
      background: var(--sidebar); 
      border-right: 1px solid var(--border); 
      display: flex; 
      flex-direction: column; 
      padding: 24px 16px; 
      backdrop-filter: blur(var(--glass-blur)); 
      -webkit-backdrop-filter: blur(var(--glass-blur)); 
      transition: 0.3s; 
      z-index: 1000; 
    }
    
    .main { 
      flex: 1; 
      padding: 28px 32px; 
      overflow-y: auto; 
      height: 100vh; 
    }
    
    .panel { 
      background: var(--panel); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 22px; 
      margin-bottom: 24px; 
      backdrop-filter: blur(var(--glass-blur)); 
      -webkit-backdrop-filter: blur(var(--glass-blur)); 
      box-shadow: 0 8px 32px rgba(0,0,0,0.15); 
    }

    /* 
    ======================================================================
    BRANDING & NAVIGATION
    ======================================================================
    */
    .brand-box { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 0 8px 24px; 
      border-bottom: 1px solid var(--border); 
      margin-bottom: 20px; 
    }
    
    .brand-icon { 
      width: 42px; 
      height: 42px; 
      background: linear-gradient(135deg, var(--primary), var(--primary-hover)); 
      border-radius: 10px; 
      display: grid; 
      place-items: center; 
      font-weight: 800; 
      font-size: 18px; 
      color: #fff; 
      overflow: hidden; 
      padding: 2px;
    }
    
    .brand-icon img { 
      width: 100%; 
      height: 100%; 
      object-fit: contain; 
      border-radius: 8px; 
    }
    
    .brand-title { 
      font-size: 14px; 
      font-weight: 700; 
      line-height: 1.2; 
    }
    
    .nav-list { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      flex: 1; 
      overflow-y: auto; 
    }
    
    .nav-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 12px 14px; 
      border-radius: 12px; 
      color: var(--muted); 
      font-size: 13.5px; 
      font-weight: 600; 
      background: transparent; 
      border: 1px solid transparent; 
      cursor: pointer; 
      text-align: left; 
      transition: 0.2s; 
    }
    
    .nav-item:hover { 
      color: var(--text); 
      background: rgba(255,255,255,0.08); 
    }
    
    .nav-item.active { 
      background: rgba(255,255,255,0.1); 
      color: var(--primary); 
      border-color: var(--border); 
    }

    /* 
    ======================================================================
    BUTTONS & INPUTS
    ======================================================================
    */
    .panel-head { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 18px; 
    }
    
    .btn { 
      padding: 10px 18px; 
      border-radius: 10px; 
      font-weight: 600; 
      font-size: 13.5px; 
      border: 1px solid var(--border); 
      background: rgba(0,0,0,0.2); 
      color: var(--text); 
      cursor: pointer; 
      transition: 0.2s; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px; 
      white-space: nowrap; 
    }
    
    .btn.primary { 
      background: var(--primary); 
      border: none; 
      color: white; 
    }
    
    .btn:hover:not(:disabled) { 
      filter: brightness(1.15); 
    }
    
    .btn:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
    }
    
    .btn.voice-pulse { 
      background: var(--red) !important; 
      color: white !important; 
      border-color: var(--red) !important; 
      animation: pulseAnim 1.2s infinite; 
    }
    
    @keyframes pulseAnim { 
        0% { box-shadow: 0 0 0 0 rgba(255, 82, 99, 0.7); } 
        70% { box-shadow: 0 0 0 10px rgba(255, 82, 99, 0); } 
        100% { box-shadow: 0 0 0 0 rgba(255, 82, 99, 0); } 
    }
    
    .table-controls { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 16px; 
    }
    
    .input-field { 
      width: 100%; 
      padding: 10px 14px; 
      border-radius: 10px; 
      border: 1px solid var(--border); 
      background: rgba(0,0,0,0.3); 
      color: var(--text); 
      outline: none; 
      font-size: 14px; 
      backdrop-filter: blur(4px); 
    }
    
    .input-field:focus { 
      border-color: var(--primary); 
    }
    
    select.input-field option { 
      background-color: #0f172a; 
      color: #fff; 
    }

    /* 
    ======================================================================
    TABLES & BADGES
    ======================================================================
    */
    .table-responsive { 
      overflow-x: auto; 
      width: 100%; 
    }
    
    table { 
      width: 100%; 
      border-collapse: collapse; 
      text-align: left; 
      font-size: 13px; 
      min-width: 600px; 
    }
    
    th { 
      color: var(--muted); 
      padding: 12px 10px; 
      border-bottom: 1px solid var(--border); 
      font-size: 11px; 
      text-transform: uppercase; 
      cursor: pointer; 
      user-select: none; 
    }
    
    td { 
      padding: 14px 10px; 
      border-bottom: 1px solid var(--border); 
    }
    
    .badge { 
      padding: 4px 8px; 
      border-radius: 6px; 
      font-size: 10.5px; 
      font-weight: 700; 
      white-space: nowrap; 
    }
    
    .badge.debit { 
      background: rgba(255,82,99,0.15); 
      color: var(--red); 
    }
    
    .badge.credit { 
      background: rgba(46,213,115,0.15); 
      color: var(--green); 
    }
    
    .badge.warn { 
      background: rgba(251,197,49,0.15); 
      color: var(--warn); 
    }
    
    .badge.primary { 
      background: rgba(79, 107, 247, 0.15); 
      color: var(--primary); 
    }

    /* 
    ======================================================================
    WIDGETS & CHARTS
    ======================================================================
    */
    .chart-container { 
      height: 300px; 
      width: 100%; 
      margin-bottom: 20px; 
    }
    
    .modern-clock-box { 
      border: 1px solid var(--primary); 
      border-radius: 16px; 
      padding: 16px 28px; 
      text-align: right; 
      background: rgba(0, 0, 0, 0.35); 
      backdrop-filter: blur(8px); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
    }
    
    .modern-time { 
      font-size: 46px; 
      font-weight: 800; 
      letter-spacing: 2px; 
      font-variant-numeric: tabular-nums; 
      color: var(--text); 
      line-height: 1; 
      margin-bottom: 6px; 
    }
    
    .modern-time span { 
      font-size: 24px; 
      font-weight: 700; 
      text-transform: lowercase; 
    }
    
    .modern-date { 
      color: var(--primary); 
      font-weight: 700; 
      font-size: 14.5px; 
      letter-spacing: 0.5px; 
    }
    
    .budget-row { 
      margin-bottom: 16px; 
    }
    
    .budget-info { 
      display: flex; 
      justify-content: space-between; 
      font-size: 13px; 
      margin-bottom: 6px; 
    }
    
    .bar-bg { 
      width: 100%; 
      height: 8px; 
      background: rgba(255,255,255,0.1); 
      border-radius: 6px; 
      overflow: hidden; 
    }
    
    .bar-fill { 
      height: 100%; 
      border-radius: 6px; 
      transition: width 0.3s; 
    }
    
    .grid-2 { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 16px; 
    }
    
    .kpi-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); 
      gap: 16px; 
      margin-bottom: 24px; 
    }
    
    .kpi-val { 
      font-size: 26px; 
      font-weight: 800; 
    }

    /* 
    ======================================================================
    MODALS & OVERLAYS
    ======================================================================
    */
    .modal-overlay { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.7); 
      backdrop-filter: blur(8px); 
      display: none; 
      place-items: center; 
      z-index: 2000; 
    }
    
    .modal { 
      background: var(--panel); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      width: 100%; 
      max-width: 550px; 
      padding: 24px; 
      backdrop-filter: blur(var(--glass-blur)); 
      max-height: 90vh; 
      overflow-y: auto; 
    }
    
    .modal-head { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    
    .modal-head h3 { 
      font-size: 18px; 
      font-weight: 700; 
    }
    
    .close-btn { 
      background: none; 
      border: none; 
      font-size: 24px; 
      color: var(--muted); 
      cursor: pointer; 
    }
    
    .form-group { 
      margin-bottom: 16px; 
    }
    
    .form-group label { 
      display: block; 
      font-size: 11.5px; 
      color: var(--muted); 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      font-weight: 700; 
    }

    /* 
    ======================================================================
    VAULTS & CARDS
    ======================================================================
    */
    .quick-tile { 
      background: rgba(255,255,255,0.03); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 30px 20px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.2s; 
      backdrop-filter: blur(var(--glass-blur)); 
    }
    
    .quick-tile:hover { 
      transform: translateY(-3px); 
      background: rgba(255,255,255,0.08); 
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
    }
    
    .reminder-card { 
      background: rgba(0,0,0,0.25); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 14px; 
      min-width: 220px; 
      flex-shrink: 0; 
    }
    
    .doc-card { 
      background: rgba(0,0,0,0.25); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      overflow: hidden; 
      position: relative; 
    }
    
    .doc-card img { 
      width: 100%; 
      height: 180px; 
      object-fit: cover; 
    }
    
    .doc-card-info { 
      padding: 12px; 
    }
    
    .pass-card { 
      background: rgba(0,0,0,0.3); 
      border: 1px solid var(--primary); 
      border-radius: 12px; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }
    
    .pass-val { 
      background: rgba(0,0,0,0.5); 
      padding: 8px; 
      border-radius: 6px; 
      font-family: monospace; 
      font-size: 14px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border: 1px solid var(--border); 
    }

    /* 
    ======================================================================
    RESPONSIVE WEB ADJUSTMENTS
    ======================================================================
    */
    @media (max-width: 850px) {
      body { 
        flex-direction: column; 
      }
      .sidebar { 
        position: fixed; 
        bottom: 0; 
        width: 100%; 
        height: 75px; 
        flex-direction: row; 
        padding: 0; 
        border-right: none; 
        border-top: 1px solid var(--border); 
        z-index: 9999;
      }
      .brand-box { 
        display: none; 
      }
      .nav-list { 
        flex-direction: row; 
        width: 100%; 
        overflow-x: auto; 
        padding: 0 10px; 
        align-items: center; 
        justify-content: flex-start; 
        -ms-overflow-style: none; 
        scrollbar-width: none; 
      }
      .nav-list::-webkit-scrollbar { 
        display: none; 
      }
      .nav-item { 
        flex-direction: column; 
        font-size: 10px; 
        gap: 6px; 
        padding: 8px 14px; 
        white-space: nowrap; 
        border: none; 
        border-radius: 8px; 
      }
      .nav-item .nav-text { 
        display: block; 
      }
      .main { 
        padding: 16px; 
        padding-bottom: 90px; 
      }
      .grid-2 { 
        grid-template-columns: 1fr; 
      }
      .kpi-grid { 
        grid-template-columns: 1fr 1fr; 
        gap: 10px; 
      }
      .modern-clock-box { 
        width: 100%; 
        text-align: center; 
        padding: 12px; 
        margin-top: 10px; 
      }
      .panel-head { 
        flex-direction: column; 
        align-items: flex-start; 
        gap: 12px; 
      }
      .table-controls { 
        flex-direction: column; 
      }
      .modal { 
        padding: 16px; 
        margin: 10px; 
        width: calc(100% - 20px); 
      }
    }
  </style>
</head>
<body>

  <!-- 
  ======================================================================
  SIDEBAR NAVIGATION
  ======================================================================
  -->
  <aside class="sidebar">
    <div class="brand-box">
      <div class="brand-icon">
        <img src="../logo.png" alt="App Logo" id="app-logo-sidebar">
      </div>
      <div class="brand-title">ஆதிரா மதிவதனி Family<br><span style="font-size:11px; color:var(--muted); font-weight:400;">Expenser</span></div>
    </div>
    <nav class="nav-list">
      <button class="nav-item active" onclick="navigate('home', this)"><span class="nav-icon">🏠</span><span class="nav-text">Home</span></button>
      <button class="nav-item" onclick="navigate('overview', this)"><span class="nav-icon">⌂</span><span class="nav-text">Overview</span></button>
      <button class="nav-item" onclick="navigate('records', this)"><span class="nav-icon">▤</span><span class="nav-text">Records</span></button>
      <button class="nav-item" onclick="navigate('loans', this)"><span class="nav-icon">🏦</span><span class="nav-text">Loans</span></button>
      <button class="nav-item" onclick="navigate('analyzer', this)"><span class="nav-icon">📈</span><span class="nav-text">Analyzer</span></button>
      <button class="nav-item" onclick="navigate('budget', this)"><span class="nav-icon">🎯</span><span class="nav-text">Budget</span></button>
      <button class="nav-item" onclick="navigate('vehicle', this)"><span class="nav-icon">🚗</span><span class="nav-text">Vehicle</span></button>
      <button class="nav-item" onclick="navigate('reminders', this)"><span class="nav-icon">🔔</span><span class="nav-text">Reminders</span></button>
      <button class="nav-item" onclick="navigate('vault', this)"><span class="nav-icon">📁</span><span class="nav-text">Doc Vault</span></button>
      <button class="nav-item" onclick="navigate('passwords', this)"><span class="nav-icon">🔑</span><span class="nav-text">Pass Vault</span></button>
      <button class="nav-item" onclick="navigate('statements', this)"><span class="nav-icon">📥</span><span class="nav-text">Sync/Export</span></button>
      <button class="nav-item" onclick="navigate('settings', this)"><span class="nav-icon">⚙</span><span class="nav-text">Settings</span></button>
    </nav>
  </aside>

  <!-- 
  ======================================================================
  MAIN DASHBOARD VIEW
  ======================================================================
  -->
  <main class="main">
    <div style="display:flex; justify-content:space-between; margin-bottom: 24px; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <h2 id="view-title">Home</h2>
        <p id="view-sub" style="color:var(--muted); font-size:13px; margin-top:4px;">Welcome and quick actions.</p>
      </div>
      <div style="display: flex; gap: 10px; align-items:center; flex-wrap:wrap;">
        <button class="btn" onclick="logout()" style="border-color:var(--red); color:var(--red);">🚪 Logout</button>
        <button class="btn" id="voice-top-btn" onclick="startVoiceAssistant()">🎙️ Voice Add</button>
        <button class="btn" onclick="openTxModal('CREDIT')" style="border-color:var(--green); color:var(--green);">+ Add Income</button>
        <button class="btn primary" onclick="openTxModal('DEBIT')">+ Add Expense</button>
      </div>
    </div>
    <div id="view-container"></div>
  </main>

  <!-- 
  ======================================================================
  MODALS & OVERLAYS
  ======================================================================
  -->
  <div id="tx-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="tx-modal-title">Add Transaction</h3>
        <div style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="btn" id="voice-modal-btn" onclick="startVoiceAssistant()" style="padding:6px 12px; font-size:12px; border-color:var(--primary);">🎙️ Speak</button>

  <!--

  <script>
    // --- ENTERPRISE API CONFIGURATION ---
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTrK6rH_zgsaUVl0TRRjaxvZvvlvk5ga6pocudZ3fpQtA_AYeOP_T5fuzSHD0RRGRCLQ/exec";
    const API_KEY = "GOBI_FAMILY_SECURE_2026";

    // Cleanly handle missing images without breaking the UI
    document.getElementById('app-logo-sidebar').addEventListener('error', function() {
      this.style.display = 'none';
      this.parentElement.innerHTML = '<span style="font-size:18px; font-weight:800; color:#fff;">A</span>';
    });

    // Master Clock
    setInterval(() => {
      const timeEl = document.getElementById('live-time');
      const dateEl = document.getElementById('live-date');
      if (timeEl && dateEl) {
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12; 
        hours = hours ? hours : 12; 
        const mins = now.getMinutes().toString().padStart(2, '0');
        const secs = now.getSeconds().toString().padStart(2, '0');
        timeEl.innerHTML = `${hours.toString().padStart(2, '0')}:${mins}:${secs} <span>${ampm}</span>`;
        dateEl.innerText = now.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      }
    }, 1000);

    function getLocalISOTime() {
        const tzOffset = (new Date()).getTimezoneOffset() * 60000;
        return (new Date(Date.now() - tzOffset)).toISOString().slice(0, 16);
    }

    function encryptData(text) { 
        return btoa(encodeURIComponent(text)); 
    }
    
    function decryptData(text) { 
        try { 
            return decodeURIComponent(atob(text)); 
        } catch(e) { 
            return "Encryption Error"; 
        } 
    }
    
    function downloadDoc(b64, title) { 
        const a = document.createElement('a'); 
        a.href = b64; 
        a.download = title + (b64.includes('image/png') ? '.png' : '.jpg'); 
        document.body.appendChild(a); 
        a.click(); 
        document.body.removeChild(a); 
    }

    // --- SECURITY TIMEOUT ---
    let inactivityTimer; 
    const TIMEOUT_MS = 10 * 60 * 1000;
    
    function autoLogout() { 
        localStorage.removeItem('gf_user'); 
        alert("Session securely locked due to 10 minutes of inactivity. Please log in again."); 
        window.location.href = '../index.html'; 
    }
    
    function resetInactivityTimer() { 
        clearTimeout(inactivityTimer); 
        localStorage.setItem('gf_last_active', Date.now()); 
        inactivityTimer = setTimeout(autoLogout, TIMEOUT_MS); 
    }
    
    function checkVisibilityState() { 
        if (!document.hidden) { 
            const lastActive = localStorage.getItem('gf_last_active'); 
            if (lastActive && (Date.now() - parseInt(lastActive) > TIMEOUT_MS)) { 
                autoLogout(); 
            } else { 
                resetInactivityTimer(); 
            } 
        } 
    }
    
    ['touchstart', 'click', 'keypress', 'scroll', 'mousemove'].forEach(evt => document.addEventListener(evt, resetInactivityTimer, { passive: true }));
    document.addEventListener('visibilitychange', checkVisibilityState); 
    resetInactivityTimer(); 

    // --- STATE INITIALIZATION ---
    let currentTheme = localStorage.getItem('gf_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);

    const expCategories = ['Rent Paid', 'Groceries', 'Electricity (EB)', 'Fuel / Petrol', 'Dining Out', 'Parking', 'Snacks', 'Credit Card Bill', 'Credit Card Proxy Spend', 'Given Loan (Asset)', 'Gold Loan Paid', 'Personal Loan Paid', 'Vehicle Service', 'Vehicle Insurance', 'Home Maintenance', 'Saloon / Parlour', 'LIC Payment', 'Utility Bills', 'Shopping', 'Travel', 'Other Expense'];
    const incCategories = ['Salary Received', 'Rent Received', 'Bonus', 'Reimbursement', 'Credit Card Proxy Refund', 'Received Loan Repayment', 'Gold Loan Received', 'Personal Loan Received', 'Received Individual Loan'];

    let ledger = []; 
    let users = JSON.parse(localStorage.getItem('gf_users')) || ['Admin', 'User 2'];
    let budgets = JSON.parse(localStorage.getItem('gf_budgets')) || { 'Groceries': { type: 'Fixed', val: 15000 }, 'Credit Card Bill': { type: 'Percentage', val: 15 } };
    let reminders = []; 
    let docs = JSON.parse(localStorage.getItem('gf_docs')) || []; 
    let passwords = JSON.parse(localStorage.getItem('gf_passwords')) || [];

    let sortCol = 'date'; 
    let sortAsc = false; 
    let selectedMonthA = '2026-08'; 
    let selectedMonthB = '2026-09';

    // --- SANITIZATION ---
    function deduplicateLedger(txList) { 
        if (!txList || !Array.isArray(txList)) return []; 
        const map = new Map(); 
        for (const tx of txList) { 
            if (tx && tx.id) map.set(String(tx.id).trim(), tx); 
        } 
        return Array.from(map.values()).sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0)); 
    }
    
    function deduplicateReminders(remList) { 
        if (!remList || !Array.isArray(remList)) return []; 
        const map = new Map(); 
        for (const r of remList) { 
            if (r && r.id) map.set(String(r.id).trim(), r); 
        } 
        return Array.from(map.values()).sort((a,b) => new Date(a.date || 0) - new Date(b.date || 0)); 
    }
    
    function deduplicateDocs(docList) { 
        if (!docList || !Array.isArray(docList)) return []; 
        const map = new Map(); 
        for (const d of docList) { 
            if(d && d.id) map.set(String(d.id).trim(), d); 
        } 
        return Array.from(map.values()).sort((a,b) => String(b.id).localeCompare(String(a.id))); 
    }
    
    function deduplicatePasswords(passList) { 
        if (!passList || !Array.isArray(passList)) return []; 
        const map = new Map(); 
        for (const p of passList) { 
            if(p && p.id) map.set(String(p.id).trim(), p); 
        } 
        return Array.from(map.values()).sort((a,b) => String(a.service).localeCompare(String(b.service))); 
    }

    // --- RENDER TABLE FUNCTION ---
    function renderTableHTML(data, title, sortable) {
      try {
          const th = (lbl, col) => sortable ? `<th onclick="sortTable('${col}')">${lbl} ${sortCol===col ? (sortAsc?'↑':'↓') : ''}</th>` : `<th>${lbl}</th>`;
          
          return `
            ${title ? `<div class="panel-head"><h3>${title}</h3></div>` : ''}
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    ${th('Date & Time','date')} 
                    ${th('Type','type')} 
                    ${th('Category','category')} 
                    ${th('Description','desc')} 
                    ${th('Amount','amount')} 
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${(!data || data.length === 0) ? '<tr><td colspan="6" style="text-align:center;">No records found.</td></tr>' : ''}
                  ${(data || []).map(t => {
                      if (!t) return '';
                      const displayDate = t.date ? String(t.date).replace('T', ' ') : 'No Date';
                      const tType = t.type ? String(t.type) : 'DEBIT';
                      const tAmt = parseFloat(t.amount || 0).toLocaleString('en-IN');
                      
                      return `<tr>
                        <td style="white-space:nowrap;">${displayDate}</td>
                        <td><span class="badge ${tType.toLowerCase()}">${tType}</span></td>
                        <td>${t.category || ''}</td>
                        <td>${t.desc || ''}</td>
                        <td style="font-weight:700; color:${tType==='CREDIT'?'var(--green)':'var(--red)'};">${tType==='CREDIT'?'+':'-'} ₹${tAmt}</td>
                        <td>
                          <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="editTx('${t.id}')">✎ Edit</button> 
                          <button class="btn" style="padding:4px 8px; font-size:11px; color:var(--red);" onclick="deleteTx('${t.id}')">🗑 Delete</button>
                        </td>
                      </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>`;
      } catch (e) {
          return `<p style="color:var(--red);">Table Render Error: ${e.message}</p>`;
      }
    }

    // --- CLOUD SYNC ENGINE ---
    let isSyncing = false; 
    
    // FIX: Master sync block to prevent reverting edits!
    window.pauseSync = false; 

    function apiGetJSONP(action) {
      return new Promise((resolve, reject) => {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith("PASTE")) return reject(new Error("Missing URL"));
        
        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        const timeoutId = setTimeout(() => {
            reject(new Error("Timeout: Master Storage did not respond."));
        }, 15000);

        window[callbackName] = function(data) { 
            clearTimeout(timeoutId);
            delete window[callbackName]; 
            document.body.removeChild(script); 
            if (data.error) reject(new Error(data.error)); 
            else resolve(data); 
        };
        
        const script = document.createElement('script'); 
        script.src = `${APPS_SCRIPT_URL}?action=${action}&apiKey=${API_KEY}&t=${Date.now()}&callback=${callbackName}`; 
        
        script.onerror = () => {
            clearTimeout(timeoutId);
            reject(new Error("Network Error")); 
        };
        document.body.appendChild(script);
      });
    }

    async function apiPost(action, data) {
       try { 
           await fetch(APPS_SCRIPT_URL, { 
               method: 'POST', 
               headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
               body: JSON.stringify({ action: action, data: data, apiKey: API_KEY }) 
           }); 
           return { ok: true }; 
       } catch (err) { 
           return { ok: false }; 
       }
    }

    async function backgroundSync(isBoot = false) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith("PASTE")) return;
      
      // FIX: If we just edited something, abort background sync so it doesn't revert your data!
      if (isSyncing || window.pauseSync) return; 
      isSyncing = true;

      try {
        if (isBoot) {
            document.getElementById('view-container').innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:50vh; text-align:center;">
                    <div style="width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
                    <h3 style="color:var(--primary); font-size:22px; margin-bottom:8px;">☁️ Enterprise Cloud Sync</h3>
                    <p style="color:var(--muted); font-size:14px;">Establishing secure connection to Master Storage...</p>
                    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
                </div>`;
        }

        const cloudData = await apiGetJSONP('getDashboard');
        if(!cloudData || cloudData.error) throw new Error("Sync blocked by API Key");
        
        let cloudTxs = deduplicateLedger(cloudData.transactions || []);
        let localTxs = deduplicateLedger(JSON.parse(localStorage.getItem('gf_ledger')) || []);
        const cloudTxIds = new Set(cloudTxs.map(t => String(t.id).trim()));
        const missingInCloud = localTxs.filter(t => !cloudTxIds.has(String(t.id).trim()));

        let cloudRems = deduplicateReminders(cloudData.reminders || []);
        let localRems = deduplicateReminders(JSON.parse(localStorage.getItem('gf_reminders')) || []);
        const cloudRemIds = new Set(cloudRems.map(r => String(r.id).trim()));
        const missingRems = localRems.filter(r => !cloudRemIds.has(String(r.id).trim()));
        
        let cloudDocs = deduplicateDocs(cloudData.docs || []);
        const cloudDocIds = new Set(cloudDocs.map(d => String(d.id).trim()));
        const missingDocs = docs.filter(d => !cloudDocIds.has(String(d.id).trim()));
        
        let cloudPass = deduplicatePasswords(cloudData.passwords || []);
        const cloudPassIds = new Set(cloudPass.map(p => String(p.id).trim()));
        const missingPass = passwords.filter(p => !cloudPassIds.has(String(p.id).trim()));

        let requiresRefresh = false;

        // If we have local data that isn't in the cloud yet, push it up first
        if (missingInCloud.length > 0 || missingRems.length > 0 || missingDocs.length > 0 || missingPass.length > 0) {
           for (const tx of missingInCloud) { await apiPost('addTransaction', tx); }
           for (const r of missingRems) { await apiPost('addReminder', r); }
           for (const d of missingDocs) { try { await apiPost('addDoc', d); } catch(e){} }
           for (const p of missingPass) { try { await apiPost('addPassword', p); } catch(e){} }
           
           const updatedCloudData = await apiGetJSONP('getDashboard');
           ledger = deduplicateLedger(updatedCloudData.transactions || []);
           
           if (updatedCloudData.reminders) { reminders = deduplicateReminders(updatedCloudData.reminders); }
           if (updatedCloudData.docs) { docs = deduplicateDocs(updatedCloudData.docs); localStorage.setItem('gf_docs', JSON.stringify(docs)); }
           if (updatedCloudData.passwords) { passwords = deduplicatePasswords(updatedCloudData.passwords); localStorage.setItem('gf_passwords', JSON.stringify(passwords)); }
           if (updatedCloudData.users) { users = updatedCloudData.users; localStorage.setItem('gf_users', JSON.stringify(users)); }
           if (updatedCloudData.budgets) { budgets = updatedCloudData.budgets; localStorage.setItem('gf_budgets', JSON.stringify(budgets)); }
           requiresRefresh = true;
        } else {
           if (cloudTxs.length !== localTxs.length || cloudRems.length !== localRems.length || cloudPass.length !== passwords.length) { requiresRefresh = true; }
           ledger = cloudTxs; 
           reminders = cloudRems;
           
           if (cloudData.docs) { docs = deduplicateDocs(cloudData.docs); localStorage.setItem('gf_docs', JSON.stringify(docs)); }
           if (cloudData.passwords) { passwords = deduplicatePasswords(cloudData.passwords); localStorage.setItem('gf_passwords', JSON.stringify(passwords)); }
           if (cloudData.users && cloudData.users.length > 0) { users = cloudData.users; localStorage.setItem('gf_users', JSON.stringify(users)); requiresRefresh = true; }
           if (cloudData.budgets && Object.keys(cloudData.budgets).length > 0) { budgets = cloudData.budgets; localStorage.setItem('gf_budgets', JSON.stringify(budgets)); requiresRefresh = true; }
        }
        
        localStorage.setItem('gf_ledger', JSON.stringify(ledger));
        localStorage.setItem('gf_reminders', JSON.stringify(reminders));
        
        if (requiresRefresh || isBoot) {
            const activeNav = document.querySelector('.nav-item.active');
            if (activeNav) {
              const navText = activeNav.innerText.trim();
              if(navText.includes('Records')) navigate('records', activeNav);
              else if(navText.includes('Analyzer')) navigate('analyzer', activeNav);
              else if(navText.includes('Budget')) navigate('budget', activeNav);
              else if(navText.includes('Vehicle')) navigate('vehicle', activeNav);
              else if(navText.includes('Reminders')) navigate('reminders', activeNav);
              else if(navText.includes('Loans')) navigate('loans', activeNav);
              else if(navText.includes('Vault') && !navText.includes('Pass')) navigate('vault', activeNav);
              else if(navText.includes('Pass')) navigate('passwords', activeNav);
              else navigate('home');
            } else { navigate('home'); }
        }
      } catch(e) { 
          if (isBoot) navigate('home'); 
      } finally { 
          isSyncing = false; 
      }
    }

      const localRemData = localStorage.getItem('gf_reminders');
      let isLocalEmpty = true;
      if (localData && localData !== "[]") {

      if (isLocalEmpty && APPS_SCRIPT_URL && !APPS_SCRIPT_URL.startsWith("PASTE")) {

                  <p style="color:var(--muted); font-size:15px;">Syncing Enterprise Master Database...</p>
              </div>`;
          await backgroundSync(true);
      } else {

          navigate('home');

    }

        localStorage.setItem('gf_ledger', JSON.stringify(ledger));

        if(activeNav.includes('Records')) navigate('records'); else navigate('overview');

            } catch (err) { window.pauseSync = false; } 
        }

    // FIX: Added pauseSync to prevent the "revert back" issue seen in the video
    async function saveTx(e) { 
        e.preventDefault(); 
        const btn = document.getElementById('tx-save-btn'); 
        btn.disabled = true; 
        btn.innerText = 'Saving...'; 
        
        const id = document.getElementById('tx-id').value || 'tx_' + String(Date.now()); 
        const isEdit = document.getElementById('tx-id').value !== ''; 
        const rawDate = document.getElementById('tx-date').value || new Date().toISOString(); 
        
        const record = { 
            id: id, 
            date: rawDate, 
            type: document.getElementById('tx-type').value, 
            category: document.getElementById('tx-category').value || 'Other', 
            method: document.getElementById('tx-method').value || 'UPI', 
            desc: document.getElementById('tx-desc').value || 'Transaction', 
            notes: document.getElementById('tx-notes').value || '', 
            amount: parseFloat(document.getElementById('tx-amount').value) || 0, 
            user: document.getElementById('tx-user').value || 'User' 
        }; 
        
        const idx = ledger.findIndex(x => String(x.id).trim() === String(id).trim()); 
        if (idx >= 0) {
            ledger[idx] = record; 
        } else {
            ledger.unshift(record); 
        }
        
        ledger = deduplicateLedger(ledger); 
        localStorage.setItem('gf_ledger', JSON.stringify(ledger)); 
        closeModal('tx-modal'); 
        
        btn.disabled = false; 
        btn.innerText = 'Save Transaction'; 
        
        const activeNav = document.querySelector('.nav-item.active').innerText; 
        if(activeNav.includes('Records')) navigate('records'); else navigate('overview'); 
        
        if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) { 
            try { 
              window.pauseSync = true; // Lock the sync
              await apiPost(isEdit ? 'editTransaction' : 'addTransaction', record); 
              // Wait 5 seconds for Google Sheets to finish writing before we allow it to sync again
              setTimeout(() => { window.pauseSync = false; backgroundSync(false); }, 5000); 
            } catch (err) { window.pauseSync = false; } 
        } 
    }

          btn.classList.add('active'); 
      } else { 
          const activeBtn = Array.from(document.querySelectorAll('.nav-item')).find(b => b.getAttribute('onclick').includes(`navigate('${view}'`));

      const container = document.getElementById('view-container');

      const sub = document.getElementById('view-sub');
      
      if (view === 'home') { title.innerText = 'Home'; sub.innerText = 'Welcome and quick actions.'; container.innerHTML = renderHome(); }
      else if (view === 'overview') { title.innerText = 'Overview Dashboard'; sub.innerText = 'Executive financial summary.'; container.innerHTML = renderOverview(); renderOverviewChart(); }

      else if (view === 'vehicle') { title.innerText = 'Vehicle Dashboard'; sub.innerText = 'Fuel consumption & Reserve-to-Reserve mileage calculator.'; container.innerHTML = renderVehicle(); }
      else if (view === 'reminders') { title.innerText = 'Reminders & Important Dates'; sub.innerText = 'Track upcoming bills, scheduled payments, and events.'; container.innerHTML = renderReminders(); }
      else if (view === 'vault') { title.innerText = 'Encrypted Doc Vault'; sub.innerText = 'Securely store documents and screenshots.'; container.innerHTML = renderVault(); }
      else if (view === 'passwords') { title.innerText = 'Encrypted Password Vault'; sub.innerText = 'Store app credentials securely with client-side encryption.'; container.innerHTML = renderPasswords(); }
      else if (view === 'statements') { title.innerText = 'Statements (Import / Export)'; sub.innerText = 'Move your data across devices or download CSV reports.'; container.innerHTML = renderStatements(); }
      else if (view === 'settings') { title.innerText = 'Settings & Security'; sub.innerText = 'Manage preferences, user access, and theme.'; container.innerHTML = renderSettings(); }
    }

        const isLoan = (cat) => (cat || '').includes('Loan');

        (ledger || []).forEach(t => { 
            if (t.type === 'CREDIT') { 
                if (isLoan(t.category)) loanRec += (t.amount || 0);
                else if (!isProxy(t.category)) inc += (t.amount || 0); 
            } 
            else { 
                if (!isProxy(t.category) && !isLoan(t.category) && t.category !== 'Credit Card Bill') exp += (t.amount || 0); 
                if (t.method === 'Credit Card') ccSpent += (t.amount || 0);
                if (t.category === 'Credit Card Bill') ccPaid += (t.amount || 0);
            } 
        });
        
        let netBalance = (inc + loanRec) - (exp + ccPaid);
        
        return `

              <div class="kpi-val" style="font-size:20px; color:var(--red);">₹${exp.toLocaleString('en-IN')}</div>
            </div>
            <div class="panel" style="margin:0; padding:16px;">

              <div class="kpi-val" style="font-size:20px; color:#a55eea;">₹${loanRec.toLocaleString('en-IN')}</div>

              <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">CC SPENT</div>

          </div>
          ${renderTableHTML((ledger || []).slice(0, 5), 'Recent 5 Transactions', false)}
        `;

          return `<div class="panel" style="border-color:var(--red);"><h3 style="color:var(--red);">Rendering Error</h3><p style="font-size:13px; color:var(--muted);">${err.message}</p></div>`;
      }
    }

    function renderOverviewChart() {
      const ctx = document.getElementById('overviewChart'); 
      if (!ctx || typeof Chart === 'undefined') return;
      
      let m1 = 0, m1_e = 0, m2 = 0, m2_e = 0;
      
      (ledger || []).forEach(t => { 
          if ((t.date || '').startsWith(selectedMonthA)) { 
              if(t.type === 'CREDIT' && !(t.category || '').includes('Loan') && !(t.category || '').includes('Proxy')) m1 += (t.amount || 0); 
              else if(t.type === 'DEBIT' && !(t.category || '').includes('Proxy') && t.category !== 'Credit Card Bill') m1_e += (t.amount || 0); 
          } 
          if ((t.date || '').startsWith(selectedMonthB)) { 
              if(t.type === 'CREDIT' && !(t.category || '').includes('Loan') && !(t.category || '').includes('Proxy')) m2 += (t.amount || 0); 
              else if(t.type === 'DEBIT' && !(t.category || '').includes('Proxy') && t.category !== 'Credit Card Bill') m2_e += (t.amount || 0); 
          } 
      });
      
      new Chart(ctx, { 
          type: 'bar', 
          data: { 
              labels: [selectedMonthA, selectedMonthB], 
              datasets: [
                  { label: 'Income', data: [m1, m2], backgroundColor: '#2ed573' }, 
                  { label: 'Expenses', data: [m1_e, m2_e], backgroundColor: '#ff5263' }
              ] 
          }, 
          options: { responsive: true, maintainAspectRatio: false } 
      });
    }

    function executeSearch() { 
      const q = document.getElementById('search-input').value.toLowerCase(); 
      const filtered = ledger.filter(t => 
        (t.desc || '').toLowerCase().includes(q) || 
        (t.category || '').toLowerCase().includes(q) || 
        (t.amount || 0).toString().includes(q)
      ); 
      document.getElementById('records-table-container').innerHTML = renderTableHTML(filtered, '', true); 
    }
    
    function attachSearchLogic() { 
      document.getElementById('search-input').addEventListener('keyup', (e) => { if(e.key === 'Enter') executeSearch(); }); 
    }
    
    function sortTable(col) { 
      sortAsc = (sortCol === col) ? !sortAsc : true; 
      sortCol = col; 
      ledger.sort((a, b) => { 
        let valA = a[col]; let valB = b[col]; 
        if (col === 'amount') { valA = parseFloat(valA); valB = parseFloat(valB); } 
        return (valA < valB ? -1 : (valA > valB ? 1 : 0)) * (sortAsc ? 1 : -1); 
      }); 
      document.getElementById('records-table-container').innerHTML = renderTableHTML(ledger, '', true); 
    }

    function renderLoans() {
      try {
        const loanData = (ledger || []).filter(t => (t.category || '').includes('Loan') || (t.category || '').includes('Lent'));
        let assetGiven = 0, assetRepaid = 0, debtReceived = 0, debtRepaid = 0;
        
        loanData.forEach(t => {
            if (t.category === 'Given Loan (Asset)') assetGiven += (t.amount || 0);
            if (t.category === 'Received Loan Repayment') assetRepaid += (t.amount || 0);
            if ((t.category || '').includes('Received') && t.category !== 'Received Loan Repayment') debtReceived += (t.amount || 0);
            if ((t.category || '').includes('Paid') && t.category !== 'Rent Paid' && t.category !== 'LIC Payment') debtRepaid += (t.amount || 0);
        });

        return `
        <div class="kpi-grid">
            <div class="panel" style="margin:0; padding:20px; border-color:var(--green);">
                <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">LOANS GIVEN (ASSETS)</div>

    function renderAnalyzer() {
      try {
        const aggA = {}; const aggB = {};
        
        (ledger || []).forEach(t => { 
          if (t.type === 'DEBIT' && !(t.category || '').includes('Proxy')) { 
            if ((t.date || '').startsWith(selectedMonthA)) aggA[t.category] = (aggA[t.category] || 0) + (t.amount || 0); 
            if ((t.date || '').startsWith(selectedMonthB)) aggB[t.category] = (aggB[t.category] || 0) + (t.amount || 0); 
          } 
        });
        
        const allCats = [...new Set([...Object.keys(aggA), ...Object.keys(aggB)])];
        let compRows = allCats.map(c => { 
          const valA = aggA[c] || 0; 
          const valB = aggB[c] || 0; 
          const diff = valB - valA; 
          
          let diffStr = `<span>₹0</span>`; 
          if (diff > 0) diffStr = `<span style="color:var(--red);">+₹${diff.toLocaleString('en-IN')}</span>`; 
          else if (diff < 0) diffStr = `<span style="color:var(--green);">-₹${Math.abs(diff).toLocaleString('en-IN')}</span>`; 
          
          return `<tr><td>${c}</td><td>₹${valA.toLocaleString('en-IN')}</td><td>₹${valB.toLocaleString('en-IN')}</td><td>${diffStr}</td></tr>`; 
        }).join('');
        
        if (!compRows) compRows = `<tr><td colspan="4" style="text-align:center;">No data for selected months.</td></tr>`;
        
        return `
          <div class="panel">
            <div class="panel-head">
              <h3>Month-over-Month Comparison</h3>
              <div style="display:flex; gap:10px;">
                <input type="month" id="cmp-month-a" class="input-field" value="${selectedMonthA}" onchange="updateAnalyzerMonths()">
                <span style="align-self:center;">vs</span>
                <input type="month" id="cmp-month-b" class="input-field" value="${selectedMonthB}" onchange="updateAnalyzerMonths()">
              </div>
            </div>
            <div class="table-responsive">
              <table style="margin-bottom: 24px;">
                <thead><tr><th>Category</th><th>Month A</th><th>Month B</th><th>Difference</th></tr></thead>
                <tbody>${compRows}</tbody>
              </table>
            </div>
            <div class="panel-head"><h3>Selected Month (B) Distribution</h3></div>
            <div class="chart-container" style="height:250px;"><canvas id="analyzerChart"></canvas></div>
          </div>`;
      } catch (err) {
        return `<div class="panel" style="border-color:var(--red);"><h3 style="color:var(--red);">Rendering Error</h3><p style="font-size:13px; color:var(--muted);">${err.message}</p></div>`;
      }
    }
    
    function updateAnalyzerMonths() { 
      selectedMonthA = document.getElementById('cmp-month-a').value; 
      selectedMonthB = document.getElementById('cmp-month-b').value; 
      navigate('analyzer'); 
    }
    
    function renderAnalyzerChart() { 
      const ctx = document.getElementById('analyzerChart'); 
      if (!ctx || typeof Chart === 'undefined') return; 
      
      const agg = {}; 
      (ledger || []).filter(t => t.type === 'DEBIT' && !(t.category || '').includes('Proxy') && (t.date || '').startsWith(selectedMonthB)).forEach(t => { 
        agg[t.category] = (agg[t.category] || 0) + (t.amount || 0); 
      }); 
      
      new Chart(ctx, { 
        type: 'doughnut', 
        data: { 
          labels: Object.keys(agg), 
          datasets: [{ data: Object.values(agg), backgroundColor: ['#4f6bf7', '#2ed573', '#ff5263', '#fbc531', '#a55eea', '#45aaf2'] }] 
        }, 
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } } 
      }); 
    }

    function renderBudget() {
      try {
        let totalIncome = (ledger || []).filter(t => t.type === 'CREDIT' && !(t.category || '').includes('Loan') && !(t.category || '').includes('Proxy') && (t.date || '').startsWith('2026-09')).reduce((s, t) => s + (t.amount || 0), 0); 
        if(totalIncome === 0) totalIncome = 68000; 
        
        let budgetHTML = Object.keys(budgets || {}).map(cat => {
          const b = budgets[cat]; 
          const target = b.type === 'Percentage' ? (totalIncome * (b.val || 0) / 100) : (b.val || 0); 
          const spent = (ledger || []).filter(t => t.type === 'DEBIT' && t.category === cat && (t.date || '').startsWith('2026-09')).reduce((s,t) => s + (t.amount || 0), 0);
          
          const pct = target > 0 ? Math.round((spent / target) * 100) : 0; 
          let color = 'var(--green)'; 
          if (pct > 100) color = 'var(--red)'; 
          else if (pct > 85) color = 'var(--warn)'; 
          const remains = target - spent;
          
          return `
            <div class="budget-row">
              <div class="budget-info">
                <div><strong>${cat}</strong> <span style="color:var(--muted); font-size:11px; margin-left:6px;">${b.type || 'Fixed'}</span></div>
                <div>₹${spent.toLocaleString('en-IN')} / ₹${target.toLocaleString('en-IN')} <span style="color:${color}; font-weight:700;">${pct}%</span></div>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width:${Math.min(pct, 100)}%; background:${color};"></div>
              </div>
              <div style="font-size:11px; color:var(--muted); margin-top:4px; text-align:right;">
                ${remains < 0 ? `<span style="color:var(--red)">Over budget by ₹${Math.abs(remains)}</span>` : `₹${remains} remaining`}
              </div>
            </div>`;
        }).join('');
        
        return `
          <div class="panel">
            <div class="panel-head">
              <h3>Monthly Allocations</h3>
              <button class="btn primary" onclick="openBudgetModal()">+ Edit / Add Budget</button>
            </div>
            ${budgetHTML || '<p style="color:var(--muted); font-size:13px;">No budgets configured yet.</p>'}
          </div>`;
      } catch (err) {
        return `<div class="panel" style="border-color:var(--red);"><h3 style="color:var(--red);">Rendering Error</h3><p style="font-size:13px; color:var(--muted);">${err.message}</p></div>`;
      }
    }

    function renderVehicle() {
      try {
        const fuelTxs = (ledger || []).filter(t => t.category === 'Fuel / Petrol').sort((a,b) => new Date(a.date || 0) - new Date(b.date || 0));
        const vMap = {}; 
        let totalFuelSpent = 0; 
        let globalLiters = 0;
        
        fuelTxs.forEach(t => { 
          totalFuelSpent += (t.amount || 0); 
          try { 
            const data = JSON.parse(t.notes || '{}'); 
            if (data && data.vehicle && data.odo) { 
              if (!vMap[data.vehicle]) vMap[data.vehicle] = { entries: [], lastReserveOdo: null, accumulatedLiters: 0, count: 0 }; 
              vMap[data.vehicle].entries.push({ 
                date: t.date, 
                odo: data.odo, 
                liters: data.liters, 
                price: data.price, 
                isReserve: data.isReserve, 
                resOdo: data.resOdo || data.odo, 
                amount: t.amount 
              }); 
              globalLiters += (data.liters || 0); 
            } 
          } catch(e) {} 
        });
        
        let vehicleCards = '';
        for (const vName in vMap) {
            const vData = vMap[vName]; 
            vData.entries.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            let vTotalCost = 0; 
            let vTotalLiters = 0; 
            let minOdo = vData.entries.length > 0 ? vData.entries[0].odo : 0; 
            let maxOdo = vData.entries.length > 0 ? vData.entries[vData.entries.length - 1].odo : 0; 
            let totalDistTracked = Math.max(0, maxOdo - minOdo);
            let reserveDist = 0; 
            let reserveLiters = 0;
            
            vData.entries.forEach(entry => {
                vTotalCost += (entry.amount || 0); 
                vTotalLiters += (entry.liters || 0);
                
                if (entry.isReserve) { 
                  if (vData.lastReserveOdo !== null && vData.accumulatedLiters > 0) { 
                    reserveDist += (entry.resOdo - vData.lastReserveOdo); 
                    reserveLiters += vData.accumulatedLiters; 
                  } 
                  vData.lastReserveOdo = entry.resOdo; 
                  vData.accumulatedLiters = entry.liters; 
                } else { 
                  if (vData.lastReserveOdo !== null) { 
                    vData.accumulatedLiters += entry.liters; 
                  } 
                }
            });
            
            let trueMileage = reserveLiters > 0 ? (reserveDist / reserveLiters).toFixed(2) : 0; 
            let costPerKm = totalDistTracked > 0 ? (vTotalCost / totalDistTracked).toFixed(2) : 0;
            
            vehicleCards += `
              <div class="panel" style="background: rgba(255,255,255,0.02);">
                <div style="display:flex; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
                  <h4 style="font-size:18px; color:var(--primary); font-weight:700;">🚗 ${vName}</h4>
                  <div style="display:flex; gap:8px;">
                    <span class="badge credit">Avg Mileage: ${trueMileage > 0 ? trueMileage + ' km/l' : 'Need 2 Reserves'}</span>
                    <span class="badge warn">Cost/KM: ₹${costPerKm}</span>
                  </div>
                </div>
                <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); margin-bottom:16px;">
                  <div style="padding:10px; border:1px solid var(--border); border-radius:10px; background:rgba(0,0,0,0.2);">
                    <div style="font-size:10px; color:var(--muted);">TOTAL DISTANCE</div>
                    <div style="font-size:16px; font-weight:bold;">${totalDistTracked} KM</div>
                  </div>
                  <div style="padding:10px; border:1px solid var(--border); border-radius:10px; background:rgba(0,0,0,0.2);">
                    <div style="font-size:10px; color:var(--muted);">TOTAL LITERS</div>
                    <div style="font-size:16px; font-weight:bold;">${vTotalLiters.toFixed(2)} L</div>
                  </div>
                  <div style="padding:10px; border:1px solid var(--border); border-radius:10px; background:rgba(0,0,0,0.2);">
                    <div style="font-size:10px; color:var(--muted);">TOTAL SPENT</div>
                    <div style="font-size:16px; font-weight:bold; color:var(--red);">₹${vTotalCost.toLocaleString('en-IN')}</div>
                  </div>
                </div>
                <div class="table-responsive">
                  <table>
                    <thead><tr><th>Date</th><th>Odo (KM)</th><th>Liters</th><th>Price/L</th><th>Reserve Hit?</th><th>Cost</th></tr></thead>
                    <tbody>${vData.entries.slice().reverse().map(e => `
                      <tr>
                        <td>${(e.date || '').split('T')[0]}</td>
                        <td>${e.odo}</td>
                        <td>${(e.liters || 0).toFixed(2)} L</td>
                        <td>₹${e.price || '-'}</td>
                        <td><span class="badge ${e.isReserve ? 'primary' : ''}">${e.isReserve ? 'Yes ('+e.resOdo+')' : 'No'}</span></td>
                        <td style="color:var(--red); font-weight:bold;">- ₹${e.amount}</td>
                      </tr>`).join('')}
                    </tbody>
                  </table>
                </div>
              </div>`;
        }
        
        return `
          <div class="kpi-grid">
            <div class="panel" style="margin:0; padding:20px;">
              <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">TOTAL FUEL SPENT</div>
              <div class="kpi-val" style="color:var(--red);">₹${totalFuelSpent.toLocaleString('en-IN')}</div>
            </div>
            <div class="panel" style="margin:0; padding:20px;">
              <div style="font-size:12px; color:var(--muted); margin-bottom:6px;">TOTAL LITERS ADDED</div>
              <div class="kpi-val" style="color:var(--warn);">${globalLiters.toFixed(2)} L</div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head">
              <h3>Vehicle Log & Mileage Calculator</h3>
              <button class="btn primary" onclick="openFuelModal()">+ Add Vehicle Log</button>
            </div>
            <p style="color:var(--muted); font-size:13px; margin-bottom:16px;">To calculate accurate mileage, ensure you check "Reserve Hit" when the fuel indicator drops to reserve and note the exact Reserve Odometer reading.</p>
            ${vehicleCards || '<p style="text-align:center; color:var(--muted); padding:20px;">No vehicle fuel entries found.</p>'}
          </div>`;
      } catch (err) {
        return `<div class="panel" style="border-color:var(--red);"><h3 style="color:var(--red);">Rendering Error</h3><p style="font-size:13px; color:var(--muted);">${err.message}</p></div>`;
      }
    }

      }

          } catch(err) { window.pauseSync = false; } 
        } 
      } 
    }

    function saveDoc(e) {
      e.preventDefault(); 
      const btn = document.getElementById('doc-btn-save'); 
      btn.disabled = true; 
      btn.innerText = "Encrypting...";
      
      const file = document.getElementById('doc-file').files[0]; 
      const title = document.getElementById('doc-title').value;
      if(!file) return;
      
      const reader = new FileReader();
      reader.onload = (ev) => {
          const img = new Image();
          img.onload = async () => {
              const canvas = document.createElement('canvas'); 
              const MAX_WIDTH = 400; 
              const scale = MAX_WIDTH / img.width;
              canvas.width = MAX_WIDTH; 
              canvas.height = img.height * scale;
              const ctx = canvas.getContext('2d'); 
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              
              const b64 = canvas.toDataURL('image/jpeg', 0.4); 
              const docObj = { id: 'doc_' + Date.now(), date: new Date().toISOString(), title: title, b64: b64 };
              
              docs.unshift(docObj); 
              localStorage.setItem('gf_docs', JSON.stringify(docs));
              
              closeModal('doc-modal'); 
              btn.disabled = false; 
              btn.innerText = "Encrypt & Upload"; 
              document.getElementById('doc-file').value=''; 
              document.getElementById('doc-title').value=''; 
              navigate('vault');
              
              if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) { 
                try { 
                  window.pauseSync = true;
                  await apiPost('addDoc', docObj); 
                  setTimeout(() => { window.pauseSync = false; backgroundSync(false); }, 5000);
                } catch(err){ window.pauseSync = false; } 
              }
          };
          img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

      dlAnchorElem.setAttribute("href", dataStr); 
      
      const bkNow = new Date(); 
      const bkDate = bkNow.getFullYear() + '-' + String(bkNow.getMonth() + 1).padStart(2, '0') + '-' + String(bkNow.getDate()).padStart(2, '0'); 
      dlAnchorElem.setAttribute("download", `Enterprise_Finance_Backup_${bkDate}.json`); 
      
      document.body.appendChild(dlAnchorElem); 
      dlAnchorElem.click(); 
      document.body.removeChild(dlAnchorElem); 
    }
    
    function importFullBackup(event) { 
      const file = event.target.files[0]; 
      if (!file) return; 
      
      const reader = new FileReader(); 
      reader.onload = function(e) { 
        try { 
          const importedData = JSON.parse(e.target.result); 
          if (importedData.ledger) { 
            const existingIds = new Set(ledger.map(t => String(t.id).trim())); 
            let added = 0; 
            importedData.ledger.forEach(t => { 
              if (!existingIds.has(String(t.id).trim())) { 
                if (t.date && t.date.includes('T')) t.date = t.date.split('T')[0]; 
                ledger.push(t); 
                added++; 
              } 
            }); 
            ledger = deduplicateLedger(ledger); 
            localStorage.setItem('gf_ledger', JSON.stringify(ledger)); 
            
            if (importedData.budgets) { 
              budgets = importedData.budgets; 
              localStorage.setItem('gf_budgets', JSON.stringify(budgets)); 
            } 
            
            if (importedData.reminders) { 
              const existingRemIds = new Set(reminders.map(r => String(r.id).trim())); 
              importedData.reminders.forEach(r => { 
                if (!existingRemIds.has(String(r.id).trim())) { 
                  if (r.date && r.date.includes('T')) r.date = r.date.split('T')[0]; 
                  reminders.push(r); 
                } 
              }); 
              reminders = deduplicateReminders(reminders); 
              localStorage.setItem('gf_reminders', JSON.stringify(reminders)); 
            } 
            
            if(importedData.docs) { 
              const existingDocs = new Set(docs.map(d=>String(d.id).trim())); 
              importedData.docs.forEach(d=>{ 
                if(!existingDocs.has(String(d.id).trim())) docs.push(d); 
              }); 
              docs = deduplicateDocs(docs); 
              localStorage.setItem('gf_docs', JSON.stringify(docs)); 
            } 
            
            if(importedData.passwords) { 
              const existingPass = new Set(passwords.map(p=>String(p.id).trim())); 
              importedData.passwords.forEach(p=>{ 
                if(!existingPass.has(String(p.id).trim())) passwords.push(p); 
              }); 
              passwords = deduplicatePasswords(passwords); 
              localStorage.setItem('gf_passwords', JSON.stringify(passwords)); 
            } 
            
            if (importedData.users) { 
              users = [...new Set([...users, ...importedData.users])]; 
              localStorage.setItem('gf_users', JSON.stringify(users)); 
            } 
            
            alert(`✅ Backup Restored: Merged ${added} new transactions.`); 
            navigate('records'); 
            
            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) {
              window.pauseSync = false;
              backgroundSync(); 
            }
          } else { 
            alert("Invalid backup file format."); 
          } 
        } catch (err) { 
          alert("Error reading backup file: " + err.message); 
        } 
      }; 
      reader.readAsText(file); 
      event.target.value = ''; 
    }
    
    function exportCSV() { 
      const period = document.getElementById('export-period').value; 
      let filtered = ledger; 
      const now = new Date(); 
      
      if (period !== 'ALL') { 
        filtered = ledger.filter(t => { 
          const tDate = new Date(t.date || 0); 
          if (period === 'CUR_MONTH') return (t.date || '').startsWith(now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0')); 
          if (period === 'LAST_3_MONTHS') return (now - tDate) <= (90 * 24 * 60 * 60 * 1000); 
          if (period === 'LAST_6_MONTHS') return (now - tDate) <= (180 * 24 * 60 * 60 * 1000); 
          if (period === 'LAST_1_YEAR') return (now - tDate) <= (365 * 24 * 60 * 60 * 1000); 
          return true; 
        }); 
      } 
      
      if (filtered.length === 0) return alert("No transactions available for this period."); 
      
      const headers = ['Date', 'Type', 'Category', 'Description', 'Method', 'Amount', 'User', 'Notes']; 
      const rows = filtered.map(t => [
        t.date || '', 
        t.type || '', 
        t.category || '', 
        `"${t.desc || ''}"`, 
        t.method || '', 
        t.amount || 0, 
        t.user || '', 
        `"${t.notes || ''}"`
      ]); 
      
      const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n'); 
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); 
      const url = URL.createObjectURL(blob); 
      
      const link = document.createElement("a"); 
      link.href = url; 
      link.download = `Enterprise_Statement_${period}.csv`; 
      document.body.appendChild(link); 
      link.click(); 
      document.body.removeChild(link); 
    }

    function processImport() { 
      const text = document.getElementById('import-text').value; 
      const method = document.getElementById('import-method').value; 
      if (!text.trim()) return alert('Please paste some text to import.'); 
      
      const lines = text.split('\n'); 
      let addedCount = 0; 
      
      const catMap = { 'zomato': 'Dining Out', 'swiggy': 'Dining Out', 'restaurant': 'Dining Out', 'food': 'Dining Out', 'amazon': 'Groceries', 'flipkart': 'Groceries', 'supermarket': 'Groceries', 'mart': 'Groceries', 'uber': 'Fuel / Petrol', 'ola': 'Fuel / Petrol', 'petrol': 'Fuel / Petrol', 'fuel': 'Fuel / Petrol', 'airtel': 'Utility Bills', 'jio': 'Utility Bills', 'electricity': 'Electricity (EB)', 'tneb': 'Electricity (EB)', 'hospital': 'Medical / Pharmacy', 'pharmacy': 'Medical / Pharmacy', 'clinic': 'Medical / Pharmacy', 'lic': 'LIC Payment', 'insurance': 'LIC Payment', 'salon': 'Saloon / Parlour', 'parlour': 'Saloon / Parlour', 'hair': 'Saloon / Parlour', 'salary': 'Salary Received', 'payroll': 'Salary Received', 'emi': 'Loan', 'loan': 'Loan', 'travel': 'Travel' }; 
      
      let sessionData = {};
      try { sessionData = JSON.parse(localStorage.getItem('gf_user') || '{}'); } catch(e){}
      const user = sessionData.name || 'Admin'; 
      
      lines.forEach(line => { 
        if (!line.trim()) return; 
        
        let dateMatch = line.match(/(\d{1,4})[-/.](\d{1,2})[-/.](\d{1,4})/); 
        const impNow = new Date(); 
        let dateStr = impNow.getFullYear() + '-' + String(impNow.getMonth() + 1).padStart(2, '0') + '-' + String(impNow.getDate()).padStart(2, '0'); 
        
        if (dateMatch) { 
          let part1 = dateMatch[1], part2 = dateMatch[2], part3 = dateMatch[3]; 
          if (part1.length === 4) { part3 = part1; part1 = dateMatch[3]; } 
          else if (part3.length === 2) { part3 = '20' + part3; } 
          dateStr = `${part3}-${part2.padStart(2, '0')}-${part1.padStart(2, '0')}`; 
        } 
        
        let amtMatch = line.match(/(?:(?:Rs\.?|INR|₹|\$)?\s?)?([\d,]+(?:\.\d+)?)(?:\s?(Cr|Dr|cr|dr))?/g); 
        let amount = 0; 
        let isCredit = false; 
        
        if (amtMatch && amtMatch.length > 0) { 
          let lastAmt = amtMatch[amtMatch.length - 1]; 
          if (lastAmt.toLowerCase().includes('cr')) isCredit = true; 
          amount = parseFloat(lastAmt.replace(/[^\d.]/g, '')); 
        } 
        if (!amount || isNaN(amount)) return; 
        
        let desc = line.replace(/(\d{1,4})[-/.](\d{1,2})[-/.](\d{1,4})/, '').replace(/(?:(?:Rs\.?|INR|₹|\$)?\s?)?([\d,]+(?:\.\d+)?)(?:\s?(Cr|Dr|cr|dr))?/g, '').trim(); 
        if (!desc) desc = 'Imported Transaction'; 
        
        let category = isCredit ? 'Reimbursement' : 'Other Expense'; 
        let lowerDesc = desc.toLowerCase(); 
        
        for (const [key, val] of Object.entries(catMap)) { 
          if (lowerDesc.includes(key)) { 
            category = val; 
            if (incCategories.includes(val)) isCredit = true; 
            break; 
          } 
        } 
        
        if (!isCredit && category === 'Reimbursement') category = 'Other Expense'; 
        
        ledger.unshift({ 
          id: 'tx_imp_' + Date.now() + Math.floor(Math.random()*1000), 
          date: dateStr, 
          type: isCredit ? 'CREDIT' : 'DEBIT', 
          category: category, 
          method: method, 
          desc: desc.substring(0, 50), 
          notes: 'Auto-Imported', 
          amount: amount, 
          user: user 
        }); 
        addedCount++; 
      }); 
      
      if (addedCount > 0) { 
        ledger = deduplicateLedger(ledger); 
        localStorage.setItem('gf_ledger', JSON.stringify(ledger)); 
        alert(`Successfully imported ${addedCount} transactions locally.`); 
        document.getElementById('import-text').value = ''; 
        if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) {
          window.pauseSync = false;
          backgroundSync(); 
        }
      } else { 
        alert('Could not find recognizable dates or amounts. Ensure text contains dates (DD/MM/YYYY) and numbers.'); 
      } 
    }

    async function startVoiceAssistant() { 
        const WebSpeech = window.SpeechRecognition || window.webkitSpeechRecognition; 
        if (!WebSpeech) { 
            alert("Voice recognition is restricted in this browser."); 
            return; 
        } 
        try { 
            const recognition = new WebSpeech(); 
            recognition.continuous = false; 
            recognition.lang = 'en-IN'; 
            recognition.interimResults = false; 
            
            const topBtn = document.getElementById('voice-top-btn'); 
            const modalBtn = document.getElementById('voice-modal-btn'); 
            
            if (topBtn) { topBtn.classList.add('voice-pulse'); topBtn.innerText = "🛑 Listening..."; } 
            if (modalBtn) { modalBtn.classList.add('voice-pulse'); modalBtn.innerText = "🛑 Listening..."; } 
            
            recognition.onerror = (e) => { resetVoiceUI(); }; 
            recognition.onend = () => { resetVoiceUI(); }; 
            recognition.onresult = (event) => { processVoiceCommand(event.results[0][0].transcript); }; 
            
            recognition.start(); 
        } catch (err) { 
            resetVoiceUI(); 
        } 
    }
    
    function resetVoiceUI() { 
        const topBtn = document.getElementById('voice-top-btn'); 
        const modalBtn = document.getElementById('voice-modal-btn'); 
        if (topBtn) { topBtn.classList.remove('voice-pulse'); topBtn.innerText = "🎙️ Voice Add"; } 
        if (modalBtn) { modalBtn.classList.remove('voice-pulse'); modalBtn.innerText = "🎙️ Speak"; } 
    }
    
    function processVoiceCommand(text) { 
        const lower = text.toLowerCase(); 
        let type = 'DEBIT'; 
        
        if (lower.includes('credit') || lower.includes('income') || lower.includes('salary') || lower.includes('received')) {
            type = 'CREDIT'; 
        }
        
        let amount = ''; 
        const amtMatch = lower.match(/(?:(?:rs\.?|rupees|inr|₹)\s*)?(\d+(?:\.\d+)?)/i); 
        if (amtMatch) amount = parseFloat(amtMatch[1]); 
        
        let method = 'UPI'; 
        if (lower.includes('credit card')) method = 'Credit Card'; 
        else if (lower.includes('debit card')) method = 'Debit Card'; 
        else if (lower.includes('cash')) method = 'Cash'; 
        
        let category = type === 'DEBIT' ? expCategories[0] : incCategories[0]; 
        const voiceCatMap = { 'grocery': 'Groceries', 'supermarket': 'Groceries', 'rent': type === 'CREDIT' ? 'Rent Received' : 'Rent Paid', 'electricity': 'Electricity (EB)', 'petrol': 'Fuel / Petrol', 'fuel': 'Fuel / Petrol', 'dining': 'Dining Out', 'restaurant': 'Dining Out', 'snack': 'Snacks', 'salary': 'Salary Received', 'shopping': 'Shopping', 'travel': 'Travel' }; 
        
        for (const [key, val] of Object.entries(voiceCatMap)) { 
            if (lower.includes(key)) { category = val; break; } 
        } 
        
        openTxModal(type); 
        document.getElementById('tx-amount').value = amount || ''; 
        document.getElementById('tx-category').value = category; 
        document.getElementById('tx-method').value = method; 
        document.getElementById('tx-desc').value = text; 
        document.getElementById('tx-notes').value = "Added via Voice Assistant"; 
    }

    // Initialize Application
    window.addEventListener('DOMContentLoaded', bootApp);
  </script>
</body>
</html>
